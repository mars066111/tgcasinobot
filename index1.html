<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Telegram Casino Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .balance-box span {
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .user-profile {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }

        .promo-banner {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .promo-banner h2 {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .promo-banner p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .game-card .icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .game-card .title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 200;
            overflow-y: auto;
            padding: 20px;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: var(--card-bg);
            border: none;
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .game-arena {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
        }

        .bet-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 14px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .bet-control input {
            background: transparent;
            border: none;
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: bold;
            width: 80px;
            text-align: center;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px var(--accent-gold-glow);
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background: #334155;
            color: var(--text-main);
            box-shadow: none;
            margin-top: 8px;
        }

        .display-screen {
            background: #0f172a;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.5rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 2px;
        }

        .slots-reel {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 2.8rem;
            margin: 20px 0;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .mine-cell {
            background: #334155;
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #334155;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            transition: transform 0.3s ease;
            z-index: 1000;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="balance-box">
            <span>🪙</span>
            <span id="user-balance">1000</span>
        </div>
        <div class="user-profile">VIP Player</div>
    </header>

    <div class="container">
        <div class="promo-banner">
            <h2>🔥 10 VIP Игр Казино</h2>
            <p>Выбирай игру, крути и выигрывай крупные фишки!</p>
        </div>

        <div class="section-title">
            <span>Доступные игры</span>
            <span>10 из 10</span>
        </div>

        <div class="games-grid">
            <div class="game-card" onclick="openGame('slots')">
                <div class="icon">🎰</div>
                <div class="title">Слоты 777</div>
            </div>
            <div class="game-card" onclick="openGame('roulette')">
                <div class="icon">🎡</div>
                <div class="title">Рулетка</div>
            </div>
            <div class="game-card" onclick="openGame('dice')">
                <div class="icon">🎲</div>
                <div class="title">Кости (Dice)</div>
            </div>
            <div class="game-card" onclick="openGame('mines')">
                <div class="icon">💣</div>
                <div class="title">Мины (Mines)</div>
            </div>
            <div class="game-card" onclick="openGame('coinflip')">
                <div class="icon">🪙</div>
                <div class="title">Монетка</div>
            </div>
            <div class="game-card" onclick="openGame('hilo')">
                <div class="icon">📈</div>
                <div class="title">Выше / Ниже</div>
            </div>
            <div class="game-card" onclick="openGame('plinko')">
                <div class="icon">🔺</div>
                <div class="title">Плинко</div>
            </div>
            <div class="game-card" onclick="openGame('blackjack')">
                <div class="icon">🃏</div>
                <div class="title">Блэкджек</div>
            </div>
            <div class="game-card" onclick="openGame('crash')">
                <div class="icon">🚀</div>
                <div class="title">Краш (Rocket)</div>
            </div>
            <div class="game-card" onclick="openGame('wheel')">
                <div class="icon">🎯</div>
                <div class="title">Колесо Фортуны</div>
            </div>
        </div>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeGame()">← Назад</button>
            <h3 id="modal-game-title">Игра</h3>
            <div style="width: 50px;"></div>
        </div>
        <div class="game-arena" id="game-content-area"></div>
    </div>

    <div id="toast">Уведомление</div>

    <script>
        let balance = 1000;
        const balanceEl = document.getElementById('user-balance');
        
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bonus = urlParams.get('bonus');
            if (bonus) {
                balance += parseInt(bonus);
                showToast(`🎁 Получен бонус: +${bonus} фишек!`);
            }
            updateBalance();
        });

        function updateBalance() {
            balanceEl.innerText = balance;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function openGame(gameKey) {
            const modal = document.getElementById('game-modal');
            const titleEl = document.getElementById('modal-game-title');
            const area = document.getElementById('game-content-area');
            modal.classList.add('active');

            switch(gameKey) {
                case 'slots':
                    titleEl.innerText = "🎰 Слоты 777";
                    area.innerHTML = `
                        <div>
                            <div class="slots-reel" id="slots-display"><span>🍒</span><span>🍋</span><span>🔔</span></div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="slot-bet" value="50">
                            </div>
                        </div>
                        <button class="btn" onclick="playSlots()">Крутить слоты</button>
                    `;
                    break;
                case 'roulette':
                    titleEl.innerText = "🎡 Европейская Рулетка";
                    area.innerHTML = `
                        <div>
                            <div class="display-screen" id="roulette-screen">Выберите цвет</div>
                            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                                <button class="btn" style="background:#ef4444; color:white;" onclick="playRoulette('red')">Красное (2x)</button>
                                <button class="btn" style="background:#1e293b; color:white; border: 1px solid #475569;" onclick="playRoulette('black')">Черное (2x)</button>
                            </div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="roulette-bet" value="50">
                            </div>
                        </div>
                    `;
                    break;
                case 'dice':
                    titleEl.innerText = "🎲 Кости";
                    area.innerHTML = `
                        <div>
                            <div class="display-screen" id="dice-screen">🎲 ⚀ ⚁</div>
                            <p style="color:var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">Угадайте сумму броска (> 7)</p>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="dice-bet" value="50">
                            </div>
                        </div>
                        <button class="btn" onclick="playDice()">Бросить кости</button>
                    `;
                    break;
                case 'mines':
                    titleEl.innerText = "💣 Мины";
                    area.innerHTML = `
                        <div>
                            <div style="font-size:0.9rem; margin-bottom:5px;" id="mines-status">Нажмите Старт для игры</div>
                            <div class="mines-grid" id="mines-grid">
                                ${Array(12).fill(0).map(() => `<div class="mine-cell" style="opacity:0.5;">❓</div>`).join('')}
                            </div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="mines-bet" value="50">
                            </div>
                        </div>
                        <button class="btn" id="mines-start-btn" onclick="startMines()">Начать игру</button>
                    `;
                    break;
                case 'coinflip':
                    titleEl.innerText = "🪙 Монетка";
                    area.innerHTML = `
                        <div>
                            <div class="display-screen" id="coin-screen">🪙</div>
                            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                                <button class="btn" onclick="playCoin('heads')">Орел</button>
                                <button class="btn btn-secondary" onclick="playCoin('tails')">Решка</button>
                            </div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="coin-bet" value="50">
                            </div>
                        </div>
                    `;
                    break;
                case 'hilo':
                    titleEl.innerText = "📈 Выше / Ниже";
                    area.innerHTML = `
                        <div>
                            Число: <span id="hilo-num" style="font-size: 2rem; color: var(--accent-gold); font-weight:bold;">50</span>
                            <div class="display-screen" id="hilo-status">Угадай, следующее больше или меньше?</div>
                            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                                <button class="btn" style="background:var(--accent-green);" onclick="playHilo('high')">Выше ⬆️</button>
                                <button class="btn" style="background:var(--accent-red); color:white;" onclick="playHilo('low')">Ниже ⬇️</button>
                            </div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="hilo-bet" value="50">
                            </div>
                        </div>
                    `;
                    break;
                case 'plinko':
                    titleEl.innerText = "🔺 Плинко";
                    area.innerHTML = `
                        <div>
                            <div class="display-screen" id="plinko-screen">🎯 Шар готов</div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="plinko-bet" value="50">
                            </div>
                        </div>
                        <button class="btn" onclick="playPlinko()">Запустить шар</button>
                    `;
                    break;
                case 'blackjack':
                    titleEl.innerText = "🃏 Блэкджек";
                    area.innerHTML = `
                        <div>
                            <div style="text-align: left; margin-bottom: 10px;">
                                <p>Дилер: <span id="bj-dealer">?</span></p>
                                <p>Игрок: <span id="bj-player">0</span></p>
                            </div>
                            <div class="display-screen" id="bj-screen">Сделайте ставку</div>
                            <div class="bet-control" id="bj-bet-box">
                                <span>Ставка:</span>
                                <input type="number" id="bj-bet" value="50">
                            </div>
                            <div id="bj-actions" style="display: none; gap: 8px;">
                                <button class="btn" onclick="bjHit()">Ещё</button>
                                <button class="btn btn-secondary" onclick="bjStand()">Хватит</button>
                            </div>
                        </div>
                        <button class="btn" id="bj-start-btn" onclick="startBlackjack()">Играть</button>
                    `;
                    break;
                case 'crash':
                    titleEl.innerText = "🚀 Краш (Rocket)";
                    area.innerHTML = `
                        <div>
                            <div class="display-screen" id="crash-screen" style="font-size: 2.5rem; color: var(--accent-gold);">1.00x</div>
                            <div class="bet-control" id="crash-bet-box">
                                <span>Ставка:</span>
                                <input type="number" id="crash-bet" value="50">
                            </div>
                        </div>
                        <button class="btn" id="crash-btn" onclick="startCrash()">Запуск ракеты</button>
                    `;
                    break;
                case 'wheel':
                    titleEl.innerText = "🎯 Колесо Фортуны";
                    area.innerHTML = `
                        <div>
                            <div class="display-screen" id="wheel-screen">🎁 X2, X3, X5, X10</div>
                            <div class="bet-control">
                                <span>Ставка:</span>
                                <input type="number" id="wheel-bet" value="50">
                            </div>
                        </div>
                        <button class="btn" onclick="playWheel()">Крутить колесо</button>
                    `;
                    break;
            }
        }

        function closeGame() {
            document.getElementById('game-modal').classList.remove('active');
        }

        function playSlots() {
            let bet = parseInt(document.getElementById('slot-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
            const s1 = symbols[Math.floor(Math.random() * symbols.length)];
            const s2 = symbols[Math.floor(Math.random() * symbols.length)];
            const s3 = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('slots-display').innerHTML = `<span>${s1}</span><span>${s2}</span><span>${s3}</span>`;
            if (s1 === s2 && s2 === s3) {
                let win = bet * 10; balance += win; showToast(`🎉 ДЖЕКПОТ! Выиграно ${win} фишек!`);
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                let win = bet * 2; balance += win; showToast(`✨ Выигрыш: ${win} фишек!`);
            } else {
                showToast("😢 Увы, повезет в следующий раз!");
            }
            updateBalance();
        }

        function playRoulette(choice) {
            let bet = parseInt(document.getElementById('roulette-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const screen = document.getElementById('roulette-screen');
            screen.innerText = "🎡 Крутится...";
            setTimeout(() => {
                const winColor = Math.random() < 0.48 ? 'red' : (Math.random() < 0.96 ? 'black' : 'green');
                screen.innerText = `Выпало: ${winColor === 'red' ? '🔴 Красное' : (winColor === 'black' ? '⚫ Черное' : '🟢 Зеленое')}`;
                if (winColor === choice) {
                    let win = bet * 2; balance += win; showToast(`🎉 Победа! +${win} фишек`);
                } else {
                    showToast("😢 Проигрыш");
                }
                updateBalance();
            }, 1000);
        }

        function playDice() {
            let bet = parseInt(document.getElementById('dice-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            const sum = d1 + d2;
            const diceChars = ['⚀','⚁','⚂','⚃','⚄','⚅'];
            document.getElementById('dice-screen').innerText = `${diceChars[d1-1]} ${diceChars[d2-1]} (Сумма: ${sum})`;
            if (sum > 7) {
                let win = bet * 2; balance += win; showToast(`🎉 Выпало ${sum}. Победа! +${win}`);
            } else {
                showToast(`😢 Выпало ${sum}. Проигрыш.`);
            }
            updateBalance();
        }

        let minesActive = false, minePosition = -1, currentMultiplier = 1;
        function startMines() {
            let bet = parseInt(document.getElementById('mines-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            minesActive = true; minePosition = Math.floor(Math.random() * 12); currentMultiplier = 1.2;
            document.getElementById('mines-status').innerText = "Выбирайте ячейки осторожно!";
            document.getElementById('mines-start-btn').innerText = "Забрать выигрыш";
            document.getElementById('mines-start-btn').onclick = cashOutMines;
            const grid = document.getElementById('mines-grid');
            grid.innerHTML = '';
            for(let i=0; i<12; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell'; cell.innerText = '❓'; cell.style.background = '#334155';
                cell.onclick = () => clickMine(i);
                grid.appendChild(cell);
            }
        }

        function clickMine(index) {
            if (!minesActive) return;
            const cells = document.getElementsByClassName('mine-cell');
            if (index === minePosition) {
                cells[index].innerText = '💥'; cells[index].style.background = '#ef4444';
                showToast("💥 Вы подорвались на мине!"); endMines(false);
            } else {
                cells[index].innerText = '💎'; cells[index].style.background = '#10b981'; cells[index].onclick = null;
                currentMultiplier += 0.5; showToast(`💎 Чисто! Множитель: x${currentMultiplier.toFixed(1)}`);
            }
        }

        function cashOutMines() {
            if (!minesActive) return;
            let bet = parseInt(document.getElementById('mines-bet').value);
            let win = Math.floor(bet * currentMultiplier);
            balance += win; updateBalance();
            showToast(`🎉 Забрано ${win} фишек!`); endMines(true);
        }

        function endMines(won) {
            minesActive = false;
            document.getElementById('mines-start-btn').innerText = "Начать игру";
            document.getElementById('mines-start-btn').onclick = startMines;
            if(!won) {
                const cells = document.getElementsByClassName('mine-cell');
                if(cells[minePosition]) { cells[minePosition].innerText = '💥'; cells[minePosition].style.background = '#ef4444'; }
            }
        }

        function playCoin(choice) {
            let bet = parseInt(document.getElementById('coin-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const res = Math.random() < 0.5 ? 'heads' : 'tails';
            document.getElementById('coin-screen').innerText = res === 'heads' ? '🪙 Орел' : '🪙 Решка';
            if (res === choice) {
                let win = bet * 2; balance += win; showToast(`🎉 Победа! +${win}`);
            } else {
                showToast("😢 Не угадали");
            }
            updateBalance();
        }

        let hiloCurrentNum = 50;
        function playHilo(guess) {
            let bet = parseInt(document.getElementById('hilo-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const nextNum = Math.floor(Math.random() * 100) + 1;
            document.getElementById('hilo-num').innerText = nextNum;
            let win = false;
            if (guess === 'high' && nextNum > hiloCurrentNum) win = true;
            if (guess === 'low' && nextNum < hiloCurrentNum) win = true;
            hiloCurrentNum = nextNum;
            if (win) {
                let prize = Math.floor(bet * 1.9); balance += prize; showToast(`🎉 Верно! +${prize}`);
            } else {
                showToast("😢 Мимо!");
            }
            updateBalance();
        }

        function playPlinko() {
            let bet = parseInt(document.getElementById('plinko-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const multipliers = [0.2, 0.5, 1, 2, 5, 10];
            const mult = multipliers[Math.floor(Math.random() * multipliers.length)];
            let win = Math.floor(bet * mult); balance += win;
            document.getElementById('plinko-screen').innerText = `Шар упал на множитель x${mult}`;
            showToast(`🎉 Выигрыш: ${win} фишек`); updateBalance();
        }

        let bjState = { player: 0, dealer: 0 };
        function startBlackjack() {
            let bet = parseInt(document.getElementById('bj-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            bjState.player = Math.floor(Math.random() * 10) + 10;
            bjState.dealer = Math.floor(Math.random() * 6) + 12;
            document.getElementById('bj-dealer').innerText = `${bjState.dealer - 4} + ?`;
            document.getElementById('bj-player').innerText = bjState.player;
            document.getElementById('bj-screen').innerText = "Игра идет...";
            document.getElementById('bj-bet-box').style.display = 'none';
            document.getElementById('bj-start-btn').style.display = 'none';
            document.getElementById('bj-actions').style.display = 'flex';
        }

        function bjHit() {
            bjState.player += Math.floor(Math.random() * 6) + 2;
            document.getElementById('bj-player').innerText = bjState.player;
            if (bjState.player > 21) {
                document.getElementById('bj-screen').innerText = "💥 Перебор!";
                showToast("😢 Перебор!"); endBlackjack();
            }
        }

        function bjStand() {
            let bet = parseInt(document.getElementById('bj-bet').value);
            document.getElementById('bj-dealer').innerText = bjState.dealer;
            if (bjState.player > bjState.dealer || bjState.dealer > 21) {
                let win = bet * 2; balance += win;
                document.getElementById('bj-screen').innerText = "🎉 Победа!"; showToast(`🎉 Вы выиграли ${win} фишек!`);
            } else {
                document.getElementById('bj-screen').innerText = "😢 Дилер выиграл"; showToast("😢 Дилер оказался сильнее");
            }
            updateBalance(); endBlackjack();
        }

        function endBlackjack() {
            document.getElementById('bj-bet-box').style.display = 'flex';
            document.getElementById('bj-start-btn').style.display = 'block';
            document.getElementById('bj-actions').style.display = 'none';
            updateBalance();
        }

        let crashInterval = null;
        function startCrash() {
            let bet = parseInt(document.getElementById('crash-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            let mult = 1.00;
            const screen = document.getElementById('crash-screen');
            const btn = document.getElementById('crash-btn');
            document.getElementById('crash-bet-box').style.display = 'none';
            btn.innerText = "ЗАБРАТЬ";
            let crashed = false, crashPoint = (Math.random() * 3 + 1.1).toFixed(2);
            btn.onclick = () => {
                if (crashed) return;
                clearInterval(crashInterval);
                let win = Math.floor(bet * mult); balance += win; updateBalance();
                showToast(`🎉 Успешно забрано! +${win}`); resetCrash();
            };
            crashInterval = setInterval(() => {
                mult += 0.05; screen.innerText = mult.toFixed(2) + 'x';
                if (mult >= crashPoint) {
                    clearInterval(crashInterval); crashed = true;
                    screen.innerText = "💥 CRASHED!"; showToast("💥 Ракета взорвалась!"); resetCrash();
                }
            }, 100);
        }

        function resetCrash() {
            const btn = document.getElementById('crash-btn');
            btn.innerText = "Запуск ракеты"; btn.onclick = startCrash;
            document.getElementById('crash-bet-box').style.display = 'flex';
            updateBalance();
        }

        function playWheel() {
            let bet = parseInt(document.getElementById('wheel-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            const multipliers = [0, 1, 2, 3, 5, 10];
            const mult = multipliers[Math.floor(Math.random() * multipliers.length)];
            let win = bet * mult; balance += win;
            document.getElementById('wheel-screen').innerText = `Колесо остановилось на: x${mult}`;
            if (mult > 0) { showToast(`🎉 Выигрыш: ${win} фишек!`); } else { showToast("😢 Пусто сектор 0"); }
            updateBalance();
        }
    </script>
</body>
</html>
