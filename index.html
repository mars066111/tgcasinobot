<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1f2125);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #2d3139);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h1 { margin-top: 0; font-size: 24px; color: #f39c12; }
        .balance { font-size: 28px; font-weight: bold; margin: 20px 0; color: #2ecc71; }
        .btn {
            background-color: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎰 Telegram Casino</h1>
        <p>Ваш баланс:</p>
        <div class="balance" id="balance">🪙 1000 монет</div>
        <button class="btn" onclick="playDice()">🎲 Бросить кости (-50)</button>
        <button class="btn" style="background-color: #e74c3c;" onclick="playSlots()">🎰 Слот-машина (-100)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        let balance = 1000;

        function updateDisplay() {
            document.getElementById('balance').innerText = `🪙 ${balance} монет`;
        }

        function playDice() {
            if (balance < 50) {
                alert('Недостаточно средств!');
                return;
            }
            balance -= 50;
            let roll = Math.floor(Math.random() * 6) + 1;
            if (roll >= 4) {
                balance += 100;
                alert(`🎉 Выпало ${roll}! Вы выиграли 100 монет!`);
            } else {
                alert(`😢 Выпало ${roll}. Вы проиграли.`);
            }
            updateDisplay();
            tg.HapticFeedback.impactOccurred('medium'); // Вибрация в телефоне
        }

        function playSlots() {
            if (balance < 100) {
                alert('Недостаточно средств!');
                return;
            }
            balance -= 100;
            let win = Math.random() < 0.2; // 20% шанс джекпота
            if (win) {
                balance += 500;
                alert('🔥 ДЖЕКПОТ! Вы выиграли 500 монет!');
            } else {
                alert('🎰 Мимо! Попробуйте еще раз.');
            }
            updateDisplay();
            tg.HapticFeedback.notificationOccurred(win ? 'success' : 'error');
        }
    </script>
</body>
</html>
