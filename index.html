<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Telegram Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f0c1b 50%, #050508 100%);
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .casino-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #db2777);
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(124, 58, 237, 0.4);
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 { margin: 0 0 8px 0; font-size: 26px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); font-weight: 900; }
        .balance-container { font-size: 32px; font-weight: 900; color: #facc15; margin-bottom: 6px; text-shadow: 0 0 15px rgba(250, 204, 21, 0.6); }
        .bonus-info { font-size: 13px; color: #fca5a5; margin-bottom: 14px; font-weight: 700; text-transform: uppercase; }
        .btn-bonus {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        .section-title {
            width: 100%; max-width: 400px; font-size: 17px; font-weight: 900; color: #f43f5e; margin-bottom: 12px; padding-left: 4px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }
        .games-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px; margin-bottom: 30px;
        }
        .game-card {
            background: linear-gradient(145deg, #1e1b2e, #2d2640); border-radius: 20px; padding: 16px 12px; text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .game-card h3 { margin: 0 0 4px 0; font-size: 15px; color: #fff; font-weight: 800; }
        .game-desc { font-size: 11px; color: #cbd5e1; margin-bottom: 12px; }
        .btn-game {
            color: #ffffff; border: none; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 800; cursor: pointer; width: 100%;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 4, 15, 0.95); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px);
        }
        .modal-content {
            background: linear-gradient(135deg, #16132b, #211b40); border-radius: 26px; padding: 18px; width: 94%; max-width: 380px; text-align: center;
            border: 2px solid #7c3aed; box-shadow: 0 25px 60px rgba(139, 92, 246, 0.4);
        }
        .modal-title { font-size: 19px; font-weight: 900; color: #facc15; margin-bottom: 10px; }
        .animation-box {
            margin: 10px 0; min-height: 120px; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .controls-group { margin-bottom: 10px; text-align: left; font-size: 13px; }
        .controls-group label { display: block; color: #cbd5e1; margin-bottom: 4px; font-weight: 700; }
        .controls-group select, .controls-group input {
            width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #7c3aed; background: #0f0c1b; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; font-weight: 600;
        }
        .btn-action {
            background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 14px;
            padding: 13px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 5px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        .btn-close { background: transparent; border: none; color: #94a3b8; font-size: 13px; margin-top: 12px; cursor: pointer; text-decoration: underline; font-weight: 700; }
        
        /* Стили для игры Мины в стиле референса */
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 320px; margin: 0 auto;
        }
        .mine-cell {
            aspect-ratio: 1; background: linear-gradient(145deg, #3b82f6, #1d4ed8); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); transition: transform 0.1s; border: 1px solid rgba(255,255,255,0.2);
        }
        .mine-cell:active { transform: scale(0.92); }
        .mine-cell.opened { background: #1e1b2e; border: 1px solid #4f46e5; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .mines-footer {
            display: flex; justify-content: space-between; align-items: center; background: #0f0c1b; border-radius: 12px; padding: 8px 12px; margin-top: 10px; border: 1px solid #7c3aed;
        }
    </style>
</head>
<body>

    <div class="casino-header">
        <h1>⚡ VIP CASINO ⚡</h1>
        <div class="balance-container" id="balance">🪙 1000</div>
        <div class="bonus-info" id="timerText">Бонус доступен!</div>
        <button class="btn-bonus" onclick="claimBonus()">🎁 ЗАБРАТЬ БОНУС (+200)</button>
    </div>

    <div class="section-title">🔥 Топовые игры</div>

    <div class="games-grid">
        <div class="game-card" style="border-color: #f43f5e;">
            <h3>✈️ Самолётик</h3>
            <div class="game-desc">Легендарный Crash</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #e11d48, #f43f5e);" onclick="openGame('crash')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #10b981;">
            <h3>💣 Мины (Mines)</h3>
            <div class="game-desc">Выше риск — больше куш</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #059669, #10b981);" onclick="openGame('mines')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #38bdf8;">
            <h3>🏎️ Стритрейсинг</h3>
            <div class="game-desc">Ночной драг-рейсинг</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #0284c7, #38bdf8);" onclick="openGame('racing')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #eab308;">
            <h3>🎣 Золотая Рыбалка</h3>
            <div class="game-desc">Ловля сундуков со дна</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #ca8a04, #eab308);" onclick="openGame('fishing')">Играть</button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Игра</div>
            <div class="animation-box" id="animBox">🎲</div>
            <div id="modalBody"></div>
            <button class="btn-action" id="actionBtn" onclick="executeGame()">Сделать ставку</button>
            <br>
            <button class="btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = localStorage.getItem('casino_balance');
        balance = balance === null ? 1000 : parseInt(balance);

        let nextBonusTime = localStorage.getItem('casino_bonus');
        nextBonusTime = nextBonusTime === null ? Date.now() : parseInt(nextBonusTime);

        updateDisplay();
        let currentGame = '';
        let crashInterval = null;

        // Переменные для игры Мины
        let minesState = { active: false, grid: [], minesCount: 3, openedCount: 0, bet: 100 };

        setInterval(() => {
            let now = Date.now();
            let diff = nextBonusTime - now;
            let btn = document.querySelector('.btn-bonus');
            let timerTxt = document.getElementById('timerText');
            if (diff <= 0) {
                timerTxt.innerText = "Бонус доступен!";
                btn.style.display = "block";
            } else {
                let m = Math.floor(diff / 60000);
                let s = Math.floor((diff % 60000) / 1000);
                timerTxt.innerText = `Бонус через: ${m}:${s < 10 ? '0' : ''}${s}`;
                btn.style.display = "none";
            }
        }, 1000);

        function saveState() {
            localStorage.setItem('casino_balance', balance);
            localStorage.setItem('casino_bonus', nextBonusTime);
        }

        function claimBonus() {
            balance += 200;
            nextBonusTime = Date.now() + 10 * 60 * 1000;
            saveState();
            updateDisplay();
            alert('🎁 Бонус получен (+200 монет)!');
            tg.HapticFeedback.notificationOccurred('success');
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = `🪙 ${balance}`;
        }

        function openGame(game) {
            currentGame = game;
            let title = document.getElementById('modalTitle');
            let body = document.getElementById('modalBody');
            let anim = document.getElementById('animBox');
            let actionBtn = document.getElementById('actionBtn');
            
            actionBtn.style.display = 'block';

            if (game === 'crash') {
                title.innerText = "✈️ Самолётик (Crash)";
                anim.innerHTML = `<canvas id="crashCanvas" width="320" height="130" style="background:#090714; border-radius:12px; border: 1px solid #4f46e5;"></canvas>`;
                body.innerHTML = `
                    <div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="100"></div>
                    <div id="crashStatus" style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-bottom: 6px;">Нажмите старт для полёта</div>`;
                actionBtn.innerText = "Запустить полёт";
                initCrashCanvas(1.00, false);
            } 
            else if (game === 'mines') {
                title.innerText = "💣 Поле Мин";
                anim.innerHTML = `
                    <div class="mines-grid" id="minesGrid"></div>
                    <div class="mines-footer">
                        <span style="font-size:13px; color:#38bdf8;">💎 Кристаллы: <b id="gemCount">21</b></span>
                        <span style="font-size:13px; color:#ef4444;">💣 Мины: <b id="bombCountDisplay">4</b></span>
                    </div>`;
                body.innerHTML = `
                    <div class="controls-group" style="margin-top:10px;"><label>Ставка:</label><input type="number" id="bet" value="100"></div>
                    <div class="controls-group"><label>Количество мин (сложность):</label>
                        <select id="minesCountSelect" onchange="updateMinesCountLabel()">
                            <option value="1">1 мина (x1.13)</option>
                            <option value="3" selected>3 мины (x1.64)</option>
                            <option value="5">5 мин (x2.48)</option>
                            <option value="10">10 мин (x5.20)</option>
                        </select>
                    </div>`;
                actionBtn.innerText = "Начать игру";
                renderMinesPreview();
            }
            else if (game === 'racing') {
                title.innerText = "🏎️ Ночной Стритрейсинг";
                anim.innerHTML = `<canvas id="racingCanvas" width="320" height="140" style="background:#090714; border-radius:12px; border: 1px solid #0284c7;"></canvas>`;
                body.innerHTML = `
                    <div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="100"></div>
                    <div class="controls-group"><label>Выбор болида:</label>
                        <select id="racerChoice">
                            <option value="1">🔴 Красный спорткар (x2.0)</option>
                            <option value="2">🔵 Синий заряженный (x2.5)</option>
                            <option value="3">🟡 Золотой монстр (x4.0)</option>
                        </select>
                    </div>`;
                actionBtn.innerText = "Старт гонки";
                initRacingCanvas(0, 0, 0, false);
            }
            else if (game === 'fishing') {
                title.innerText = "🎣 Золотая Рыбалка";
                anim.innerHTML = `<canvas id="fishingCanvas" width="320" height="140" style="background:#090714; border-radius:12px; border: 1px solid #eab308;"></canvas>`;
                body.innerHTML = `
                    <div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="100"></div>
                    <div class="controls-group"><label>Глубина заброса:</label>
                        <select id="fishDepth">
                            <option value="1">Мелководье (x1.8)</option>
                            <option value="2">Коралловый риф (x3.0)</option>
                            <option value="3">Глубокая впадина (x5.5)</option>
                        </select>
                    </div>`;
                actionBtn.innerText = "Забросить удочку";
                initFishingCanvas("idle");
            }

            document.getElementById('gameModal').style.display = 'flex';
        }

        // --- ЛОГИКА МИН ---
        function renderMinesPreview() {
            let grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerText = '?';
                grid.appendChild(cell);
            }
        }

        function updateMinesCountLabel() {
            let mCount = document.getElementById('minesCountSelect').value;
            document.getElementById('bombCountDisplay').innerText = mCount;
            document.getElementById('gemCount').innerText = 25 - mCount;
        }

        function startMinesGame() {
            let bet = parseInt(document.getElementById('bet').value);
            if (isNaN(bet) || bet <= 0) { alert('Введите ставку!'); return; }
            if (balance < bet) { alert('Недостаточно средств!'); return; }

            balance -= bet;
            saveState();
            updateDisplay();

            let mCount = parseInt(document.getElementById('minesCountSelect').value);
            minesState = { active: true, minesCount: mCount, openedCount: 0, bet: bet, grid: [] };

            // Создаем мины (индексы от 0 до 24)
            let mines = [];
            while(mines.length < mCount) {
                let r = Math.floor(Math.random() * 25);
                if(!mines.includes(r)) mines.push(r);
            }

            let grid = document.getElementById('minesGrid');
            grid.innerHTML = '';

            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerText = '?';
                let isMine = mines.includes(i);
                
                cell.onclick = function() {
                    if(!minesState.active || cell.classList.contains('opened')) return;
                    cell.classList.add('opened');

                    if(isMine) {
                        cell.innerText = '💣';
                        cell.style.background = '#ef4444';
                        endMinesGame(false);
                    } else {
                        cell.innerText = '💎';
                        cell.style.background = '#10b981';
                        minesState.openedCount++;
                        let mults = {1: 1.13, 3: 1.64, 5: 2.48, 10: 5.20};
                        let curMult = (mults[mCount] * (1 + minesState.openedCount * 0.2)).toFixed(2);
                        document.getElementById('actionBtn').innerText = `ЗАБРАТЬ (${Math.floor(bet * curMult)} 🪙)`;
                        
                        if(minesState.openedCount >= (25 - mCount)) {
                            endMinesGame(true, curMult);
                        }
                    }
                };
                grid.appendChild(cell);
            }

            let actionBtn = document.getElementById('actionBtn');
            actionBtn.innerText = "ЗАБРАТЬ ВЫИГРЫШ";
            actionBtn.onclick = function() {
                let mults = {1: 1.13, 3: 1.64, 5: 2.48, 10: 5.20};
                let curMult = (mults[mCount] * (1 + minesState.openedCount * 0.2)).toFixed(2);
                let reward = Math.floor(bet * curMult);
                balance += reward;
                saveState();
                updateDisplay();
                alert(`🎉 Победа! Вы забрали ${reward} монет!`);
                closeModal();
            };
        }

        function endMinesGame(won, mult=1) {
            minesState.active = false;
            let actionBtn = document.getElementById('actionBtn');
            actionBtn.innerText = "Играть снова";
            actionBtn.onclick = function() { openGame('mines'); };
            if(won) {
                let reward = Math.floor(minesState.bet * mult);
                balance += reward;
                saveState();
                updateDisplay();
                alert(`🏆 Поздравляем! Все кристаллы найдены! Выигрыш: ${reward} монет.`);
            } else {
                alert(`💥 Вы подорвались на мине! Ставка сгорела.`);
                tg.HapticFeedback.notificationOccurred('error');
            }
        }


        // --- ЛОГИКА САМОЛЕТИКА (CRASH) ---
        function initCrashCanvas(mult, isCrashed, textStatus="") {
            let canvas = document.getElementById('crashCanvas');
            if (!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1e1b38'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=30) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=30) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            let progress = Math.min((mult - 1.0) / 2.5, 1);
            let endX = 40 + progress * 220;
            let endY = 110 - progress * 80;

            ctx.strokeStyle = isCrashed ? '#ef4444' : '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(20, 110); ctx.quadraticCurveTo(100, 110, endX, endY); ctx.stroke();

            ctx.font = '22px Arial';
            ctx.fillText(isCrashed ? '💥' : '✈️', endX - 10, endY + 8);

            ctx.fillStyle = isCrashed ? '#ef4444' : '#facc15';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(mult.toFixed(2) + 'x', canvas.width / 2, 40);

            if (textStatus) {
                ctx.fillStyle = '#ffffff'; ctx.font = '12px Arial';
                ctx.fillText(textStatus, canvas.width / 2, 115);
            }
        }


        // --- ЛОГИКА НОЧНОГО СТРИТРЕЙСИНГА ---
        function initRacingCanvas(p1X, p2X, p3X, isFinished, winnerText="") {
            let canvas = document.getElementById('racingCanvas');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Дорога и разметка
            ctx.fillStyle = '#111019'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 45); ctx.lineTo(canvas.width, 45); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, 95); ctx.lineTo(canvas.width, 95); ctx.stroke();

            // Машинки
            ctx.font = '20px Arial';
            ctx.fillText('🏎️', 20 + p1X, 38);
            ctx.fillText('🚙', 20 + p2X, 85);
            ctx.fillText('🏎️', 20 + p3X, 132);

            // Финишная черта
            ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4; ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(canvas.width - 40, 10); ctx.lineTo(canvas.width - 40, 130); ctx.stroke();
            ctx.setLineDash([]);

            if(winnerText) {
                ctx.fillStyle = '#facc15'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                ctx.fillText(winnerText, canvas.width / 2, 20);
            }
        }


        // --- ЛОГИКА ЗОЛОТОЙ РЫБАЛКИ ---
        function initFishingCanvas(state, depthText="") {
            let canvas = document.getElementById('fishingCanvas');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Небо и вода
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, 50);
            ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 50, canvas.width, 90);

            // Волны
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 50);
            for(let i=0; i<canvas.width; i+=20) { ctx.lineTo(i+10, 46); ctx.lineTo(i+20, 50); }
            ctx.stroke();

            // Лодка и удочка
            ctx.font = '24px Arial';
            ctx.fillText('🛶', 40, 48);

            if(state === 'casting' || state === 'success') {
                ctx.strokeStyle = '#facc15'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(55, 38); ctx.lineTo(160, 120); ctx.stroke();
                ctx.fillText('🪝', 150, 125);
            }

            if(state === 'success') {
                ctx.fillText('💎📦', 150, 90);
                ctx.fillStyle = '#facc15'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
                ctx.fillText(depthText, canvas.width / 2, 25);
            }
        }


        function closeModal() {
            if (crashInterval) { clearInterval(crashInterval); crashInterval = null; }
            document.getElementById('gameModal').style.display = 'none';
        }

        // --- ИСПОЛНЕНИЕ ДЕЙСТВИЙ ИГР ---
        async function executeGame() {
            let bet = parseInt(document.getElementById('bet').value);
            if (isNaN(bet) || bet <= 0) { alert('Введите корректную ставку!'); return; }
            if (balance < bet) { alert('❌ Недостаточно средств!'); return; }

            let actionBtn = document.getElementById('actionBtn');

            // 1. Самолётик
            if (currentGame === 'crash') {
                balance -= bet; saveState(); updateDisplay();
                actionBtn.disabled = true;
                let multiplier = 1.00;
                let crashPoint = (1.2 + Math.random() * 2.8).toFixed(2);
                
                actionBtn.innerText = "ЗАБРАТЬ ВЫИГРЫШ";
                actionBtn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";
                actionBtn.disabled = false;

                actionBtn.onclick = function() {
                    clearInterval(crashInterval);
                    let winSum = Math.floor(bet * multiplier);
                    balance += winSum; saveState(); updateDisplay();
                    initCrashCanvas(parseFloat(multiplier), false, `УСПЕХ! +${winSum} монет`);
                    document.getElementById('crashStatus').innerText = `Вы успешно забрали кэш!`;
                    actionBtn.innerText = "Запустить полёт";
                    actionBtn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                    actionBtn.onclick = executeGame;
                    tg.HapticFeedback.notificationOccurred('success');
                };

                crashInterval = setInterval(() => {
                    multiplier = (parseFloat(multiplier) + 0.08).toFixed(2);
                    initCrashCanvas(parseFloat(multiplier), false);
                    if (parseFloat(multiplier) >= parseFloat(crashPoint)) {
                        clearInterval(crashInterval);
                        initCrashCanvas(parseFloat(crashPoint), true, "ВЗРЫВ САМОЛЁТА!");
                        document.getElementById('crashStatus').innerText = `Самолёт улетел! Ставка сгорела.`;
                        actionBtn.innerText = "Запустить полёт";
                        actionBtn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                        actionBtn.onclick = executeGame;
                        actionBtn.disabled = false;
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                }, 180);
                return;
            }

            // 2. Мины
            if (currentGame === 'mines' && !minesState.active) {
                startMinesGame();
                return;
            }

            // 3. Стритрейсинг
            if (currentGame === 'racing') {
                balance -= bet; saveState(); updateDisplay();
                actionBtn.disabled = true;
                let choice = parseInt(document.getElementById('racerChoice').value);
                
                let p1 = 0, p2 = 0, p3 = 0;
                let raceInt = setInterval(() => {
                    p1 += Math.random() * 12;
                    p2 += Math.random() * 12;
                    p3 += Math.random() * 12;
                    initRacingCanvas(p1, p2, p3, false);

                    if(p1 >= 220 || p2 >= 220 || p3 >= 220) {
                        clearInterval(raceInt);
                        let winner = p1 >= p2 && p1 >= p3 ? 1 : (p2 >= p1 && p2 >= p3 ? 2 : 3);
                        let mults = {1: 2.0, 2: 2.5, 3: 4.0};
                        let won = (winner === choice);
                        let reward = won ? Math.floor(bet * mults[winner]) : 0;
                        if(won) balance += reward;
                        saveState(); updateDisplay();

                        initRacingCanvas(p1, p2, p3, true, won ? `ПОБЕДА БОЛИДА #${winner}! +${reward}` : `Победил болид #${winner}. Проигрыш.`);
                        actionBtn.disabled = false;
                        actionBtn.innerText = "Новая гонка";
                        tg.HapticFeedback.notificationOccurred(won ? 'success' : 'error');
                    }
                }, 80);
                return;
            }

            // 4. Золотая Рыбалка
            if (currentGame === 'fishing') {
                balance -= bet; saveState(); updateDisplay();
                actionBtn.disabled = true;
                let depth = document.getElementById('fishDepth').value;
                let mults = {'1': 1.8, '2': 3.0, '3': 5.5};
                
                initFishingCanvas('casting');
                setTimeout(() => {
                    let success = Math.random() < 0.55;
                    let reward = success ? Math.floor(bet * mults[depth]) : 0;
                    if(success) { balance += reward; saveState(); updateDisplay(); }

                    initFishingCanvas('success', success ? `Сундук пойман! +${reward} 🪙` : `Сорвалось! Пусто.`);
                    actionBtn.disabled = false;
                    actionBtn.innerText = "Забросить снова";
                    tg.HapticFeedback.notificationOccurred(success ? 'success' : 'error');
                }, 1500);
                return;
            }
        }
    </script>
</body>
</html>
