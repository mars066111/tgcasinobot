<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Telegram Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #31104b 0%, #11071f 50%, #030208 100%);
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .casino-header {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            border-radius: 26px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.6);
            margin-bottom: 22px;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        h1 { margin: 0 0 8px 0; font-size: 28px; color: #fff; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); font-weight: 900; }
        .balance-container { font-size: 36px; font-weight: 900; color: #fde047; margin-bottom: 6px; text-shadow: 0 0 20px rgba(253, 224, 71, 0.8); }
        .bonus-info { font-size: 13px; color: #fecdd3; margin-bottom: 14px; font-weight: 800; text-transform: uppercase; }
        .btn-bonus {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white; border: none; border-radius: 16px; padding: 14px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6);
            border: 1px solid #86efac; display: none;
        }
        .section-title {
            width: 100%; max-width: 400px; font-size: 18px; font-weight: 900; color: #fb7185; margin-bottom: 14px; padding-left: 4px; text-transform: uppercase;
            text-shadow: 0 0 12px rgba(251, 113, 133, 0.6);
        }
        .games-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 400px; margin-bottom: 30px;
        }
        .game-card {
            background: linear-gradient(145deg, #231942, #3b255e); border-radius: 22px; padding: 18px 14px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: space-between; border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .game-card h3 { margin: 0 0 4px 0; font-size: 15px; color: #fff; font-weight: 900; }
        .game-desc { font-size: 11px; color: #e2e8f0; margin-bottom: 14px; font-weight: 600; }
        .btn-game {
            color: #ffffff; border: none; border-radius: 14px; padding: 11px; font-size: 14px; font-weight: 900; cursor: pointer; width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 2, 10, 0.96); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(12px);
        }
        .modal-content {
            background: linear-gradient(135deg, #181230, #2a2050); border-radius: 28px; padding: 20px; width: 95%; max-width: 400px; text-align: center;
            border: 2px solid #a855f7; box-shadow: 0 30px 70px rgba(168, 85, 247, 0.5); max-height: 92vh; overflow-y: auto;
        }
        .modal-title { font-size: 21px; font-weight: 900; color: #fde047; margin-bottom: 12px; text-shadow: 0 0 10px rgba(253, 224, 71, 0.5); }
        .animation-box {
            margin: 12px 0; min-height: 170px; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .controls-group { margin-bottom: 12px; text-align: left; font-size: 13px; }
        .controls-group label { display: block; color: #cbd5e1; margin-bottom: 4px; font-weight: 800; }
        .controls-group select, .controls-group input {
            width: 100%; padding: 12px; border-radius: 14px; border: 2px solid #a855f7; background: #0f0c1b; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; font-weight: 700;
        }
        .btn-action {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 16px;
            padding: 14px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 6px;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6);
            border: 1px solid #86efac;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; border-radius: 16px;
            padding: 14px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; display: none;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
            border: 1px solid #fcd34d;
        }
        .btn-close { background: transparent; border: none; color: #94a3b8; font-size: 14px; margin-top: 14px; cursor: pointer; text-decoration: underline; font-weight: 800; }
        
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; width: 100%; max-width: 350px; margin: 0 auto;
        }
        .mine-cell {
            aspect-ratio: 1; background: linear-gradient(145deg, #3b82f6, #1d4ed8); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); border: 1.5px solid rgba(255,255,255,0.3);
            user-select: none;
        }
        .mine-cell:active { transform: scale(0.90); }
        .mine-cell.opened { background: #181230; border: 1.5px solid #6366f1; pointer-events: none; }
        .mine-cell.exploded { background: #ef4444 !important; border: 1.5px solid #f87171; pointer-events: none; }
        .mine-cell.disabled { pointer-events: none; opacity: 0.7; }
        .mines-footer {
            display: flex; justify-content: space-between; align-items: center; background: #0f0c1b; border-radius: 14px; padding: 10px 14px; margin-top: 12px; border: 2px solid #a855f7;
        }
    </style>
</head>
<body>

    <div class="casino-header">
        <h1>⚡ VIP CASINO ⚡</h1>
        <div class="balance-container" id="balance">🪙 1000</div>
        <div class="bonus-info" id="timerText">Загрузка бонуса...</div>
        <button class="btn-bonus" onclick="claimBonus()">🎁 ЗАБРАТЬ БОНУС (+1000)</button>
    </div>

    <div class="section-title">🔥 Каталог игр (50/50)</div>

    <div class="games-grid">
        <div class="game-card" style="border-color: #fb7185;">
            <h3>✈ Самолётик</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #f43f5e, #e11d48);" onclick="openGame('crash')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #34d399;">
            <h3>💣 Мины</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="openGame('mines')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #38bdf8;">
            <h3>🏎 Стритрейсинг</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #0284c7, #0369a1);" onclick="openGame('racing')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #facc15;">
            <h3>🎣 Золотая Рыбалка</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #eab308, #ca8a04);" onclick="openGame('fishing')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #f472b6;">
            <h3>🎈 Воздушный Шар</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #ec4899, #db2777);" onclick="openGame('balloon')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #fb923c;">
            <h3>🥊 Ночной Нокаут</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #f97316, #ea580c);" onclick="openGame('knockout')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #38bdf8;">
            <h3>🎡 Колесо Фортуны</h3>
            <div class="game-desc">Шанс 50/50</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);" onclick="openGame('wheel')">Играть</button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Игра</div>
            <div class="animation-box" id="animBox">🎲</div>
            <div id="modalBody"></div>
            <button class="btn-action" id="actionBtn" onclick="executeGame()">Сделать ставку</button>
            <button class="btn-secondary" id="secondaryBtn" style="display:none;">Продолжить / Удвоить</button>
            <br>
            <button class="btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg && tg.expand) tg.expand();

        // ЖЕСТКОЕ ОБНУЛЕНИЕ БАЛАНСА И СТАРТ С 1000 МОНЕТ
        let balance = 1000;
        localStorage.setItem('casino_balance', balance);

        // Таймер бонуса: строго 5 минут (300 секунд)
        let bonusEndTime = Math.floor(Date.now() / 1000) + 300;
        localStorage.setItem('casino_bonus_end', bonusEndTime);

        let activeInterval = null;
        let currentGame = '';
        let gameActive = false;

        // Отсчет таймера бонуса (5 минут)
        setInterval(() => {
            let currentSec = Math.floor(Date.now() / 1000);
            let storedEnd = localStorage.getItem('casino_bonus_end');
            let diff = storedEnd ? parseInt(storedEnd) - currentSec : 0;
            let btn = document.querySelector('.btn-bonus');
            let timerTxt = document.getElementById('timerText');

            if (diff <= 0) {
                timerTxt.innerText = "БОНУС ДОСТУПЕН!";
                btn.style.display = "block";
            } else {
                let m = Math.floor(diff / 60);
                let s = diff % 60;
                timerTxt.innerText = `До бонуса осталось: ${m}:${s < 10 ? '0' : ''}${s}`;
                btn.style.display = "none";
            }
        }, 1000);

        function saveState() {
            localStorage.setItem('casino_balance', balance);
        }

        function claimBonus() {
            balance += 1000; // Бонус ровно 1000
            let newEnd = Math.floor(Date.now() / 1000) + 300; // 5 минут
            localStorage.setItem('casino_bonus_end', newEnd);
            saveState();
            updateDisplay();
            alert('🎁 Бонус 1000 монет успешно зачислен!');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = `🪙 ${balance}`;
        }

        updateDisplay();

        function resetButtons() {
            gameActive = false;
            let actionBtn = document.getElementById('actionBtn');
            let secBtn = document.getElementById('secondaryBtn');
            actionBtn.style.display = 'block';
            actionBtn.disabled = false;
            actionBtn.style.opacity = '1';
            actionBtn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
            secBtn.style.display = 'none';
            actionBtn.onclick = executeGame;
            secBtn.onclick = null;
        }

        function openGame(game) {
            currentGame = game;
            gameActive = false;
            if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }

            let title = document.getElementById('modalTitle');
            let body = document.getElementById('modalBody');
            let anim = document.getElementById('animBox');
            let actionBtn = document.getElementById('actionBtn');
            
            resetButtons();

            if (game === 'crash') {
                title.innerText = "✈ Самолётик (50/50)";
                anim.innerHTML = `<canvas id="crashCanvas" width="350" height="170" style="background:#090714; border-radius:16px; border: 2px solid #6366f1;"></canvas>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div><div id="crashStatus" style="font-size: 14px; color: #38bdf8; font-weight: bold; margin-bottom: 6px;">Нажмите старт для полёта</div>`;
                actionBtn.innerText = "Запустить полёт";
                initCrashCanvas(1.00, false);
            } 
            else if (game === 'mines') {
                title.innerText = "💣 Поле Мин (50/50)";
                anim.innerHTML = `<div class="mines-grid" id="minesGrid"></div><div class="mines-footer"><span style="font-size:13px; color:#38bdf8;">💎 Ячейки: <b id="gemCount">20</b></span><span style="font-size:13px; color:#ef4444;">💣 Мины: <b id="bombCountDisplay">5</b></span></div>`;
                body.innerHTML = `<div class="controls-group" style="margin-top:10px;"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Начать игру";
                renderMinesPreview();
            }
            else if (game === 'racing') {
                title.innerText = "🏎 Ночной Стритрейсинг (50/50)";
                anim.innerHTML = `<canvas id="racingCanvas" width="350" height="170" style="background:#090714; border-radius:16px; border: 2px solid #0284c7;"></canvas>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Старт гонки";
                initRacingCanvas(0, 0, false);
            }
            else if (game === 'fishing') {
                title.innerText = "🎣 Золотая Рыбалка (50/50)";
                anim.innerHTML = `<canvas id="fishingCanvas" width="350" height="170" style="background:#090714; border-radius:16px; border: 2px solid #eab308;"></canvas>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Забросить удочку";
                initFishingCanvas("idle");
            }
            else if (game === 'balloon') {
                title.innerText = "🎈 Воздушный Шар (50/50)";
                anim.innerHTML = `<canvas id="balloonCanvas" width="350" height="170" style="background:#090714; border-radius:16px; border: 2px solid #ec4899;"></canvas>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Начать надувать шар";
                initBalloonCanvas(25, 1.00);
            }
            else if (game === 'knockout') {
                title.innerText = "🥊 Ночной Нокаут (50/50)";
                anim.innerHTML = `<canvas id="knockoutCanvas" width="350" height="170" style="background:#090714; border-radius:16px; border: 2px solid #f97316;"></canvas>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Нанести удар";
                initKnockoutCanvas("idle");
            }
            else if (game === 'wheel') {
                title.innerText = "🎡 Колесо Фортуны (50/50)";
                anim.innerHTML = `<div id="wheelBox" style="font-size:38px; font-weight:bold; color:#fde047; padding:30px;">🎡 [ ? ]</div>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Крутить колесо";
            }

            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeModal() {
            if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }
            gameActive = false;
            document.getElementById('gameModal').style.display = 'none';
        }

        function renderMinesPreview() {
            let grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell disabled';
                cell.innerText = '?';
                grid.appendChild(cell);
            }
        }

        function initCrashCanvas(mult, isCrashed, textStatus="") {
            let canvas = document.getElementById('crashCanvas');
            if (!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let progress = Math.min((mult - 1.0) / 9.0, 1);
            let endX = 50 + progress * 240;
            let endY = 140 - progress * 95;
            ctx.strokeStyle = isCrashed ? '#ef4444' : '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(20, 140); ctx.quadraticCurveTo(120, 140, endX, endY); ctx.stroke();
            ctx.font = '26px Arial'; ctx.fillText(isCrashed ? '💥' : '✈', endX - 12, endY + 10);
            ctx.fillStyle = isCrashed ? '#ef4444' : '#fde047'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
            ctx.fillText(mult.toFixed(2) + 'x', canvas.width / 2, 45);
            if (textStatus) { ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Arial'; ctx.fillText(textStatus, canvas.width / 2, 155); }
        }

        function initRacingCanvas(p1X, p2X, isFinished, winnerText="") {
            let canvas = document.getElementById('racingCanvas');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#111019'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '24px Arial';
            ctx.fillText('🏎️', 20 + p1X, 60); ctx.fillText('🚙', 20 + p2X, 120);
            if(winnerText) {
                ctx.fillStyle = '#fde047'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
                ctx.fillText(winnerText, canvas.width / 2, 25);
            }
        }

        function initFishingCanvas(state, text="") {
            let canvas = document.getElementById('fishingCanvas');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, 60);
            ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 60, canvas.width, 110);
            ctx.font = '28px Arial'; ctx.fillText('🛶 🪝', 60, 55);
            if(text) {
                ctx.fillStyle = '#fde047'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
                ctx.fillText(text, canvas.width / 2, 30);
            }
        }

        function initBalloonCanvas(radius, mult) {
            let canvas = document.getElementById('balloonCanvas');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ec4899';
            ctx.beginPath(); ctx.arc(canvas.width/2, 80, radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fde047'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
            ctx.fillText(mult.toFixed(2) + 'x', canvas.width/2, 88);
        }

        function initKnockoutCanvas(state, text="") {
            let canvas = document.getElementById('knockoutCanvas');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '40px Arial'; ctx.textAlign = 'center';
            ctx.fillText('🥊', 90, 105); ctx.fillText(state === 'hit' ? '💥😵' : '🤖', 260, 105);
            if(text) { ctx.fillStyle = '#fde047'; ctx.font = 'bold 15px Arial'; ctx.fillText(text, canvas.width/2, 30); }
        }

        // --- ИГРОВАЯ ЛОГИКА (50/50) ---
        function executeGame() {
            let bet = parseInt(document.getElementById('bet').value);
            if (isNaN(bet) || bet <= 0) { alert('⚠️ Введите корректную ставку!'); return; }
            if (balance < bet) { alert('❌ Недостаточно средств!'); return; }

            let actionBtn = document.getElementById('actionBtn');
            let secBtn = document.getElementById('secondaryBtn');

            balance -= bet; saveState(); updateDisplay();
            gameActive = true; 

            // 1. САМОЛЕТИК (50/50: либо долетает до x2.0, либо падает сразу)
            if (currentGame === 'crash') {
                actionBtn.disabled = true;
                let mult = 1.0;
                let isWin = Math.random() < 0.5; // Ровно 50% шанс
                let crashPoint = isWin ? 2.0 : 1.1;
                
                actionBtn.innerText = "ЗАБРАТЬ ВЫИГРЫШ";
                actionBtn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";
                actionBtn.disabled = false;
                
                actionBtn.onclick = function() {
                    if (!gameActive) return;
                    clearInterval(activeInterval);
                    gameActive = false;
                    let winSum = Math.floor(bet * mult);
                    balance += winSum; saveState(); updateDisplay();
                    initCrashCanvas(mult, false, `УСПЕХ! +${winSum} 🪙`);
                    document.getElementById('crashStatus').innerText = `Вы забрали выигрыш!`;
                    resetButtons();
                };

                activeInterval = setInterval(() => {
                    if (!gameActive) return;
                    mult = parseFloat((mult + 0.2).toFixed(2));
                    initCrashCanvas(mult, false);
                    if (mult >= crashPoint) {
                        clearInterval(activeInterval);
                        gameActive = false;
                        initCrashCanvas(crashPoint, true, isWin ? "УСПЕХ!" : "ВЗРЫВ! Ставка сгорела.");
                        
                        if (isWin) {
                            let winSum = Math.floor(bet * 2.0);
                            balance += winSum; saveState(); updateDisplay();
                        }

                        document.getElementById('crashStatus').innerText = isWin ? "Самолёт долетел до x2.0!" : "Самолёт упал!";
                        actionBtn.disabled = true;
                        actionBtn.style.opacity = '0.4';
                        setTimeout(() => resetButtons(), 1500);
                    }
                }, 150);
                return;
            }

            // 2. МИНЫ (50/50: 1 клик — угадал кристал или подорвался)
            if (currentGame === 'mines') {
                let isWin = Math.random() < 0.5; // Ровно 50% шанс
                let grid = document.getElementById('minesGrid');
                grid.innerHTML = '';
                
                for(let i = 0; i < 25; i++) {
                    let cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    cell.innerText = '?';
                    
                    cell.onclick = function() {
                        if(!gameActive) return;
                        gameActive = false;
                        
                        let allCells = grid.children;
                        for(let j = 0; j < 25; j++) allCells[j].classList.add('disabled');

                        if(isWin) {
                            cell.classList.add('opened');
                            cell.innerText = '💎';
                            let reward = bet * 2;
                            balance += reward; saveState(); updateDisplay();
                            alert(`🎉 Чистый выигрыш 50/50! Получено: ${reward} 🪙 (x2)`);
                        } else {
                            cell.classList.add('exploded');
                            cell.innerText = '💣';
                            alert('💥 Вы подорвались на мине! Ставка сгорела.');
                        }
                        setTimeout(() => resetButtons(), 1500);
                    };
                    grid.appendChild(cell);
                }
                actionBtn.innerText = "НАЖМИТЕ ЛЮБУЮ ЯЧЕЙКУ";
                actionBtn.disabled = true;
                return;
            }

            // 3. СТРИТРЕЙСИНГ (50/50)
            if (currentGame === 'racing') {
                actionBtn.disabled = true;
                let p1 = 0, p2 = 0;
                let isP1Win = Math.random() < 0.5; // 50/50
                
                activeInterval = setInterval(() => {
                    if(!gameActive) return;
                    p1 += isP1Win ? 10 : 6; 
                    p2 += isP1Win ? 6 : 10;
                    initRacingCanvas(p1, p2, false);
                    if(p1 >= 240 || p2 >= 240) {
                        clearInterval(activeInterval);
                        gameActive = false;
                        let won = isP1Win;
                        let reward = won ? Math.floor(bet * 2.0) : 0;
                        if(won) { balance += reward; saveState(); updateDisplay(); }
                        initRacingCanvas(p1, p2, true, won ? `ПОБЕДА КРАСНОГО! +${reward}` : `ПОБЕДА СИНИЕГО. Проигрыш.`);
                        resetButtons();
                    }
                }, 80);
                return;
            }

            // 4. РЫБАЛКА (50/50)
            if (currentGame === 'fishing') {
                actionBtn.disabled = true;
                initFishingCanvas('casting', "Удочка заброшена...");
                setTimeout(() => {
                    if(!gameActive) return;
                    let success = Math.random() < 0.5; // 50/50
                    let reward = success ? Math.floor(bet * 2.0) : 0;
                    if(success) { balance += reward; saveState(); updateDisplay(); }
                    initFishingCanvas('success', success ? `Сундук пойман! +${reward} 🪙 (x2)` : `Пусто... Сорвалось.`);
                    gameActive = false;
                    resetButtons();
                }, 1300);
                return;
            }

            // 5. ВОЗДУШНЫЙ ШАР (50/50)
            if (currentGame === 'balloon') {
                let size = 25, mult = 1.0;
                let isWin = Math.random() < 0.5; // 50/50
                
                actionBtn.innerText = "💰 ЗАБРАТЬ ВЫИГРЫШ";
                secBtn.style.display = 'block';
                secBtn.innerText = "🎈 НАДУТЬ ЕЩЕ";

                actionBtn.onclick = function() {
                    if(!gameActive) return;
                    gameActive = false;
                    let reward = Math.floor(bet * mult);
                    balance += reward; saveState(); updateDisplay();
                    alert(`🎉 Вы забрали ${reward} монет!`);
                    resetButtons();
                };

                secBtn.onclick = function() {
                    if(!gameActive) return;
                    if (!isWin) {
                        gameActive = false;
                        initBalloonCanvas(size, mult);
                        actionBtn.disabled = true;
                        secBtn.disabled = true;
                        actionBtn.style.opacity = '0.4';
                        secBtn.style.opacity = '0.4';
                        alert('💥 Шар лопнул! Ставка сгорела.');
                        setTimeout(() => resetButtons(), 1500);
                        return;
                    }
                    size += 15;
                    mult = 2.0;
                    initBalloonCanvas(size, mult);
                    actionBtn.innerText = `💰 ЗАБРАТЬ (${Math.floor(bet * mult)} 🪙 [x2])`;
                    secBtn.style.display = 'none';
                };
                return;
            }

            // 6. НОКАУТ (50/50)
            if (currentGame === 'knockout') {
                actionBtn.disabled = true;
                initKnockoutCanvas('idle', "Удар наносится...");
                setTimeout(() => {
                    if(!gameActive) return;
                    let success = Math.random() < 0.5; // 50/50
                    let reward = success ? Math.floor(bet * 2.0) : 0;
                    if(success) { balance += reward; saveState(); updateDisplay(); }
                    initKnockoutCanvas(success ? 'hit' : 'idle', success ? `НОКАУТ! +${reward} 🪙 (x2)` : `Промах! Соперник увернулся.`);
                    gameActive = false;
                    resetButtons();
                }, 1200);
                return;
            }

            // 7. КОЛЕСО ФОРТУНЫ (50/50)
            if (currentGame === 'wheel') {
                actionBtn.disabled = true;
                let wheelBox = document.getElementById('wheelBox');
                let steps = 0;
                let isWin = Math.random() < 0.5; // 50/50
                
                activeInterval = setInterval(() => {
                    if(!gameActive) return;
                    steps++;
                    let randM = [0, 2.0][Math.floor(Math.random()*2)];
                    wheelBox.innerHTML = `🎡 [ x${randM} ]`;
                    if(steps > 10) {
                        clearInterval(activeInterval);
                        gameActive = false;
                        let finalM = isWin ? 2.0 : 0;
                        let reward = Math.floor(bet * finalM);
                        if(finalM > 0) { balance += reward; saveState(); updateDisplay(); }
                        wheelBox.innerHTML = `🎡 [ x${finalM} ]<br><span style="font-size:14px; color:#fff;">Выигрыш: ${reward} 🪙</span>`;
                        resetButtons();
                    }
                }, 100);
                return;
            }
        }
    </script>
</body>
</html>
