<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Royale Casino</title>
    <style>
        :root {
            --cr-bg: #0b1426;
            --cr-card: #152238;
            --cr-card-border: #233b5c;
            --cr-gold: #ffd700;
            --cr-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cr-bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
            /* Фирменный фон с красными и синими акцентами арен Clash Royale */
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(239, 68, 68, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 20% 90%, rgba(0, 136, 255, 0.15) 0%, transparent 40%);
        }

        /* Персонажи и элементы Clash Royale на заднем фоне */
        .cr-characters-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden; opacity: 0.18;
        }
        .bg-char {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
        }
        /* Король на башне (слева сверху) */
        .char-king {
            top: 10px; left: -20px; width: 140px; height: 140px;
            background-image: url('https://deckshop.pro/img/king-blue.png');
        }
        /* Ганга гоблинов (справа сверху) */
        .char-goblin {
            top: 120px; right: -25px; width: 150px; height: 150px;
            background-image: url('https://vignette.wikia.nocookie.net/clashroyale/images/d/df/GoblinGang.png');
        }
        /* Варвар (снизу слева) */
        .char-barb {
            bottom: 40px; left: -10px; width: 140px; height: 140px;
            background-image: url('https://vignette.wikia.nocookie.net/clashroyale/images/4/43/BarbariansCard.png');
        }

        header, .container, .modal { position: relative; z-index: 10; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(11, 20, 38, 0.85);
            backdrop-filter: blur(12px); position: sticky; top: 0;
            border-bottom: 3px solid #7f1d1d;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }

        .balance-box {
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
            padding: 6px 14px; border-radius: 30px;
            border: 2px solid var(--cr-gold);
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2);
        }

        .balance-box span { color: var(--cr-gold); font-weight: 800; font-size: 1.05rem; }
        
        .user-link {
            font-size: 0.95rem; font-weight: 700; color: #fff;
            text-decoration: none; background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
            padding: 6px 12px; border-radius: 12px; border: 2px solid #fca5a5;
            box-shadow: 0 3px 0 #450a0a;
        }
        .user-link:active { transform: translateY(2px); box-shadow: 0 1px 0 #450a0a; }

        .container { max-width: 480px; margin: 0 auto; padding: 16px; }

        .promo-banner {
            background: linear-gradient(135deg, #b91c1c 0%, #1e1b4b 100%);
            border-radius: var(--radius); padding: 18px; text-align: center;
            margin-bottom: 20px; color: white; 
            border: 3px solid var(--cr-gold);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
            text-decoration: none; display: block;
            position: relative; overflow: hidden;
        }
        .promo-banner h2 { font-size: 1.3rem; margin-bottom: 4px; color: var(--cr-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .promo-banner p { font-size: 0.85rem; opacity: 0.9; font-weight: 600; color: #e2e8f0; }

        .section-title {
            font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; 
            color: var(--cr-gold); text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .games-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;
        }

        .game-card {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; 
            transition: transform 0.15s; border: 2px solid var(--cr-card-border); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 110px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4); position: relative; overflow: hidden;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card .icon { font-size: 2.3rem; margin-bottom: 6px; }
        .game-card .title { font-size: 0.9rem; font-weight: 700; color: #f8fafc; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--cr-bg); z-index: 200; overflow-y: auto; padding: 16px; flex-direction: column;
        }
        .modal.active { display: flex; }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }

        .back-btn {
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%); 
            border: 2px solid #64748b; color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer;
            box-shadow: 0 3px 0 #0f172a;
        }
        .back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f172a; }

        .game-arena {
            background: linear-gradient(180deg, #152238 0%, #0b1426 100%);
            border-radius: var(--radius); padding: 16px; text-align: center; flex-grow: 1; 
            display: flex; flex-direction: column; justify-content: space-between; 
            border: 2px solid var(--cr-card-border); max-width: 440px; margin: 0 auto; width: 100%; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .bet-control {
            display: flex; justify-content: space-between; align-items: center;
            background: #0b1426; padding: 10px 14px; border-radius: 12px; margin: 10px 0;
            border: 2px solid #7f1d1d;
        }
        .bet-control span { color: var(--text-muted); font-weight: 600; font-size: 0.9rem; }
        .bet-control input, .bet-control select {
            background: transparent; border: none; color: var(--cr-gold);
            font-size: 1.1rem; font-weight: 800; width: 110px; text-align: center; outline: none;
        }
        .bet-control select option { background: #0b1426; color: white; }

        .btn {
            background: linear-gradient(180deg, #ffea5c 0%, #ffaa00 100%);
            color: #451a03; border: 2px solid #fef08a; padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer; width: 100%;
            box-shadow: 0 5px 0 #b45309, 0 10px 20px rgba(245, 158, 11, 0.3); 
            transition: transform 0.1s; text-transform: uppercase;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b45309; }
        
        .btn-red {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            color: white; border: 2px solid #fca5a5;
            box-shadow: 0 5px 0 #7f1d1d, 0 10px 20px rgba(239, 68, 68, 0.3);
        }
        .btn-red:active { transform: translateY(4px); box-shadow: 0 1px 0 #7f1d1d; }

        .display-screen {
            background: #0b1426; border-radius: 12px; padding: 15px;
            min-height: 100px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin: 8px 0;
            border: 2px solid #7f1d1d; color: var(--text-main); gap: 6px;
        }

        /* Стили для игры Самолет с графиком */
        .aviator-box {
            position: relative; width: 100%; height: 180px; background: #050b14;
            border-radius: 12px; overflow: hidden; border: 2px solid #7f1d1d; margin-bottom: 8px;
        }
        #aviator-canvas { width: 100%; height: 100%; display: block; }
        .aviator-mult-display {
            position: absolute; top: 12px; right: 15px; font-size: 1.8rem; font-weight: 800; color: var(--cr-gold);
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* Тир (Игра 1) */
        .shooting-field {
            position: relative; width: 100%; height: 190px; background: #050b14;
            border-radius: 12px; border: 2px solid #7f1d1d; overflow: hidden; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .target-item {
            position: absolute; font-size: 2.5rem; cursor: pointer; user-select: none;
            animation: popTarget 0.8s infinite alternate ease-in-out;
        }
        @keyframes popTarget { from { transform: scale(0.9); } to { transform: scale(1.1); } }

        /* Дуэль Башен (Игра 3) */
        .duel-arena {
            display: flex; justify-content: space-around; align-items: center; background: #050b14;
            padding: 15px; border-radius: 12px; border: 2px solid #7f1d1d; margin-bottom: 8px;
        }
        .card-slot {
            width: 85px; height: 110px; background: #1e293b; border: 2px solid var(--cr-gold);
            border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card-slot span { font-size: 0.75rem; margin-top: 5px; font-weight: bold; color: var(--cr-gold); }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1e293b; color: white; border: 2px solid var(--cr-gold);
            padding: 12px 24px; border-radius: 20px; transition: transform 0.3s ease; z-index: 1000;
            font-weight: 700; box-shadow: 0 5px 25px rgba(0,0,0,0.6);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- Персонажи Clash Royale на фоне -->
    <div class="cr-characters-bg">
        <div class="bg-char char-king"></div>
        <div class="bg-char char-goblin"></div>
        <div class="bg-char char-barb"></div>
    </div>

    <header>
        <div class="balance-box"><span>🪙</span><span id="user-balance">1000</span></div>
        <a href="https://t.me/Larp333you" target="_blank" class="user-link">👑 @Larp333you</a>
    </header>

    <div class="container">
        <a href="https://t.me/Larp333you" target="_blank" class="promo-banner">
            <h2>ROYAL BATTLE ARENA</h2>
            <p>Владелец: @Larp333you — Нажми для связи!</p>
        </a>

        <div class="section-title"><span>Боевая арена (Игры)</span><span>⚔️ Royale</span></div>

        <div class="games-grid">
            <div class="game-card" onclick="openGame('shooting')"><div class="icon">🎯</div><div class="title">1. Королевский Тир</div></div>
            <div class="game-card" onclick="openGame('plane')"><div class="icon">✈️</div><div class="title">2. Самолет</div></div>
            <div class="game-card" onclick="openGame('duel')"><div class="icon">⚔️</div><div class="title">3. Дуэль Башен</div></div>
            <div class="game-card" onclick="openGame('slots')"><div class="icon">🎰</div><div class="title">Слоты 777</div></div>
            <div class="game-card" onclick="openGame('mines')"><div class="icon">💣</div><div class="title">Королевские Мины</div></div>
            <div class="game-card" onclick="openGame('dice')"><div class="icon">🎲</div><div class="title">Кубики Судьбы</div></div>
        </div>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-header">
            <button class="back-btn" onclick="closeGame()">← Меню</button>
            <h3 id="modal-game-title" style="color: var(--cr-gold); text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Игра</h3>
            <div style="width: 50px;"></div>
        </div>
        <div class="game-arena" id="game-content-area"></div>
    </div>

    <div id="toast">Уведомление</div>

    <script>
        if (!localStorage.getItem('balance_reset_royale_v3')) {
            localStorage.setItem('casino_balance', '1000');
            localStorage.setItem('balance_reset_royale_v3', 'true');
        }

        let balance = localStorage.getItem('casino_balance') !== null ? parseInt(localStorage.getItem('casino_balance')) : 1000;
        const balanceEl = document.getElementById('user-balance');
        
        window.addEventListener('DOMContentLoaded', () => { 
            const urlParams = new URLSearchParams(window.location.search);
            const bonusAmount = urlParams.get('bonus');
            if (bonusAmount) {
                let amount = parseInt(bonusAmount);
                if (!isNaN(amount) && amount > 0) {
                    balance += amount;
                    showToast(`🎁 Королевский бонус: +${amount} фишек!`);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
            updateBalance(); 
            startBonusTimer();
        });

        function updateBalance() { 
            balanceEl.innerText = balance; 
            localStorage.setItem('casino_balance', balance);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function startBonusTimer() {
            setInterval(() => {
                balance += 1000;
                updateBalance();
                showToast("🎁 Сундук арены открыт! +1000 монет!");
            }, 180000);
        }

        function openGame(gameKey) {
            const modal = document.getElementById('game-modal');
            const titleEl = document.getElementById('modal-game-title');
            const area = document.getElementById('game-content-area');
            modal.classList.add('active');

            switch(gameKey) {
                case 'shooting':
                    titleEl.innerText = "🎯 Королевский Тир";
                    area.innerHTML = `<div>
                        <div class="shooting-field" id="shooting-box">
                            <div style="color:var(--text-muted); font-size:0.9rem;">Нажмите «Начать бой», чтобы появились цели!</div>
                        </div>
                        <div class="bet-control"><span>Ставка:</span><input type="number" id="shoot-bet" value="50"></div>
                    </div><button class="btn btn-red" id="shoot-start-btn" onclick="startShootingGame()">Начать бой</button>`;
                    break;

                case 'plane':
                    titleEl.innerText = "✈️ Самолет";
                    area.innerHTML = `<div>
                        <div class="aviator-box">
                            <div class="aviator-mult-display" id="plane-mult">1.00x</div>
                            <canvas id="aviator-canvas"></canvas>
                        </div>
                        <div class="bet-control" id="plane-bet-box"><span>Ставка:</span><input type="number" id="plane-bet" value="50"></div>
                    </div><button class="btn btn-red" id="plane-btn" onclick="startPlaneGame()">Запустить Самолет</button>`;
                    setTimeout(initPlaneCanvas, 50);
                    break;

                case 'duel':
                    titleEl.innerText = "⚔️ Дуэль Башен";
                    area.innerHTML = `<div>
                        <div class="duel-arena">
                            <div class="card-slot" id="player-card">🛡️<span>Ваш юнит</span></div>
                            <div style="font-size: 1.5rem; font-weight: bold; color: var(--cr-gold);">VS</div>
                            <div class="card-slot" id="enemy-card">👺<span>Враг</span></div>
                        </div>
                        <div class="display-screen" id="duel-status">Выберите карту и начните битву!</div>
                        <div class="bet-control"><span>Ставка:</span><input type="number" id="duel-bet" value="50"></div>
                    </div><button class="btn btn-red" onclick="playDuel()">В бой!</button>`;
                    break;

                case 'slots':
                    titleEl.innerText = "🎰 Слоты 777";
                    area.innerHTML = `<div>
                        <div style="background:linear-gradient(145deg, #1e293b, #0f172a); border:4px solid #7f1d1d; border-radius:16px; padding:15px; margin-bottom:8px;">
                            <div style="display:flex; justify-content:center; gap:10px; background:#050b14; padding:12px; border-radius:10px; border:2px solid #ef4444;">
                                <div style="background:#fff; color:#000; font-size:2.2rem; width:65px; height:75px; display:flex; align-items:center; justify-content:center; border-radius:8px;">👑</div>
                                <div style="background:#fff; color:#000; font-size:2.2rem; width:65px; height:75px; display:flex; align-items:center; justify-content:center; border-radius:8px;">🪙</div>
                                <div style="background:#fff; color:#000; font-size:2.2rem; width:65px; height:75px; display:flex; align-items:center; justify-content:center; border-radius:8px;">💎</div>
                            </div>
                        </div>
                        <div class="bet-control"><span>Ставка:</span><input type="number" id="slot-bet" value="50"></div>
                    </div><button class="btn" onclick="playSlots()">Крутить слот</button>`;
                    break;

                case 'mines':
                    titleEl.innerText = "💣 Королевские Мины";
                    area.innerHTML = `<div>
                        <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:5px; margin:6px 0;" id="mines-grid">
                            ${Array(25).fill(0).map(() => `<div style="background:#1e293b; border:1px solid #334155; aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center;">🛡️</div>`).join('')}
                        </div>
                        <div class="bet-control"><span>Ставка:</span><input type="number" id="mines-bet" value="50"></div>
                    </div><button class="btn btn-red" onclick="showToast('Нажмите Старт в меню мин')">Начать бой</button>`;
                    break;

                case 'dice':
                    titleEl.innerText = "🎲 Кубики Судьбы";
                    area.innerHTML = `<div>
                        <div class="display-screen"><span style="font-size:2.2rem;">🎲 ⚀ ⚁</span><span>Бросайте кости на арене</span></div>
                        <div class="bet-control"><span>Ставка:</span><input type="number" id="dice-bet" value="50"></div>
                    </div><button class="btn" onclick="showToast('Бросок выполнен!')">Бросить кости</button>`;
                    break;
            }
        }

        function closeGame() { document.getElementById('game-modal').classList.remove('active'); }

        // Игра 1: Королевский Тир
        function startShootingGame() {
            let bet = parseInt(document.getElementById('shoot-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();

            const box = document.getElementById('shooting-box');
            const startBtn = document.getElementById('shoot-start-btn');
            startBtn.disabled = true;
            startBtn.style.opacity = '0.5';

            box.innerHTML = '';

            const characters = ['👺', '💀', '🐗', '👑'];
            const multipliers = [1.5, 2.0, 3.0, 5.0];

            let targetEl = document.createElement('div');
            let randIdx = Math.floor(Math.random() * characters.length);
            targetEl.className = 'target-item';
            targetEl.innerText = characters[randIdx];
            targetEl.style.top = Math.floor(Math.random() * 120) + 'px';
            targetEl.style.left = Math.floor(Math.random() * 250) + 'px';

            targetEl.onclick = () => {
                let win = Math.floor(bet * multipliers[randIdx]);
                balance += win; updateBalance();
                showToast(`🎯 Попадание! +${win} фишек`);
                box.innerHTML = `<div style="color: #4ade80; font-weight: bold; font-size: 1.1rem;">Цель поражена! Выигрыш: +${win}</div>`;
                startBtn.disabled = false;
                startBtn.style.opacity = '1';
                startBtn.innerText = "Еще бой";
            };

            box.appendChild(targetEl);

            setTimeout(() => {
                if (startBtn.disabled && box.contains(targetEl)) {
                    box.innerHTML = `<div style="color: #ef4444; font-weight: bold; font-size: 1.1rem;">Время истекло! Цель сбежала.</div>`;
                    startBtn.disabled = false;
                    startBtn.style.opacity = '1';
                    startBtn.innerText = "Еще бой";
                }
            }, 2500);
        }

        // Игра 2: Самолет (График с кривой и множителем)
        let planeInterval = null, currentPlaneMult = 1.00;
        let planeCanvas, planeCtx;

        function initPlaneCanvas() {
            planeCanvas = document.getElementById('aviator-canvas');
            if(!planeCanvas) return;
            planeCanvas.width = planeCanvas.parentElement.clientWidth;
            planeCanvas.height = planeCanvas.parentElement.clientHeight;
            planeCtx = planeCanvas.getContext('2d');
            drawPlaneScene(0, 0);
        }

        function drawPlaneScene(progress, multProgress) {
            if(!planeCtx) return;
            planeCtx.clearRect(0, 0, planeCanvas.width, planeCanvas.height);
            let w = planeCanvas.width, h = planeCanvas.height;

            // Сетка графика
            planeCtx.strokeStyle = 'rgba(239, 68, 68, 0.15)';
            planeCtx.lineWidth = 1;
            for(let i=0; i<w; i+=30) {
                planeCtx.beginPath(); planeCtx.moveTo(i, 0); planeCtx.lineTo(i, h); planeCtx.stroke();
            }
            for(let j=0; j<h; j+=30) {
                planeCtx.beginPath(); planeCtx.moveTo(0, j); planeCtx.lineTo(w, j); planeCtx.stroke();
            }

            if(progress <= 0) return;

            // Кривая графика (красная линия со свечением)
            planeCtx.strokeStyle = '#ef4444';
            planeCtx.lineWidth = 3;
            planeCtx.beginPath();
            planeCtx.moveTo(0, h);
            let currentX = progress * w;
            let currentY = h - (multProgress * (h * 0.7));
            if(currentY < 15) currentY = 15;

            planeCtx.quadraticCurveTo(currentX * 0.5, h - 10, currentX, currentY);
            planeCtx.stroke();

            planeCtx.lineTo(currentX, h);
            planeCtx.lineTo(0, h);
            planeCtx.fillStyle = 'rgba(239, 68, 68, 0.15)';
            planeCtx.fill();
        }

        function startPlaneGame() {
            let bet = parseInt(document.getElementById('plane-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            currentPlaneMult = 1.00;
            const multEl = document.getElementById('plane-mult');
            const btn = document.getElementById('plane-btn');
            document.getElementById('plane-bet-box').style.display = 'none';
            btn.innerText = "ЗАБРАТЬ ВЫИГРЫШ";
            
            let crashed = false, maxMult = (Math.random() * 3.0 + 1.2).toFixed(2);
            let step = 0;
            
            btn.onclick = () => {
                if (crashed) return;
                clearInterval(planeInterval);
                let win = Math.floor(bet * currentPlaneMult); balance += win; updateBalance();
                showToast(`✈️ Успешно забрали! +${win}`); resetPlane();
            };

            planeInterval = setInterval(() => {
                currentPlaneMult += 0.04;
                step += 0.02;
                if(step > 0.85) step = 0.85;

                multEl.innerText = currentPlaneMult.toFixed(2) + 'x';
                drawPlaneScene(step, currentPlaneMult - 1);

                if (currentPlaneMult >= maxMult) {
                    clearInterval(planeInterval); crashed = true;
                    multEl.innerText = "УЛЕТЕЛ 💥";
                    showToast("💥 Самолет улетел, ставка сгорела!"); resetPlane();
                }
            }, 80);
        }

        function resetPlane() {
            const btn = document.getElementById('plane-btn');
            btn.innerText = "Запустить Самолет"; btn.onclick = startPlaneGame;
            document.getElementById('plane-bet-box').style.display = 'flex';
            if(planeCtx) planeCtx.clearRect(0, 0, planeCanvas.width, planeCanvas.height);
            document.getElementById('plane-mult').innerText = "1.00x";
            updateBalance();
        }

        // Игра 3: Дуэль Башен
        function playDuel() {
            let bet = parseInt(document.getElementById('duel-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();

            const pCard = document.getElementById('player-card');
            const eCard = document.getElementById('enemy-card');
            const status = document.getElementById('duel-status');

            pCard.innerHTML = `⚔️<span>Бой...</span>`;
            eCard.innerHTML = `👺<span>Бой...</span>`;
            status.innerText = "Сражение на мосту арены...";

            setTimeout(() => {
                const units = [
                    { name: 'Рыцарь', icon: '🛡️', power: 3 },
                    { name: 'Пекка', icon: '🤖', power: 5 },
                    { name: 'Шар', icon: '🎈', power: 4 },
                    { name: 'Гоблин', icon: '👺', power: 1 }
                ];
                let pUnit = units[Math.floor(Math.random() * units.length)];
                let eUnit = units[Math.floor(Math.random() * units.length)];

                pCard.innerHTML = `${pUnit.icon}<span>${pUnit.name}</span>`;
                eCard.innerHTML = `${eUnit.icon}<span>${eUnit.name}</span>`;

                if (pUnit.power > eUnit.power) {
                    let win = bet * 2;
                    balance += win;
                    status.innerHTML = `<span style="color:#4ade80;">👑 Победа вашей карты! +${win}</span>`;
                    showToast(`🎉 Победа в дуэли! +${win}`);
                } else if (pUnit.power === eUnit.power) {
                    balance += bet;
                    status.innerHTML = `<span style="color:#facc15;">🤝 Ничья! Ставка возвращена.</span>`;
                    showToast("🤝 Ничья на мосту!");
                } else {
                    status.innerHTML = `<span style="color:#ef4444;">💀 Враг оказался сильнее!</span>`;
                    showToast("😢 Поражение в дуэли");
                }
                updateBalance();
            }, 800);
        }

        // Слоты
        function playSlots() {
            let bet = parseInt(document.getElementById('slot-bet').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { showToast("❌ Неверная ставка!"); return; }
            balance -= bet; updateBalance();
            setTimeout(() => {
                let win = bet * 3; balance += win; updateBalance();
                showToast(`🎰 Выигрыш в слотах: +${win}`);
            }, 500);
        }
    </script>
</body>
</html>
