<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Telegram Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #31104b 0%, #11071f 50%, #030208 100%);
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .casino-header {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            border-radius: 26px;
            padding: 22px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.6);
            margin-bottom: 22px;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        h1 { margin: 0 0 6px 0; font-size: 26px; color: #fff; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); font-weight: 900; }
        .balance-container { font-size: 34px; font-weight: 900; color: #fde047; margin-bottom: 4px; text-shadow: 0 0 20px rgba(253, 224, 71, 0.8); }
        .bonus-info { font-size: 12px; color: #fecdd3; margin-bottom: 12px; font-weight: 800; text-transform: uppercase; }
        .btn-bonus {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white; border: none; border-radius: 14px; padding: 12px; font-size: 15px; font-weight: 900; cursor: pointer; width: 100%;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
            border: 1px solid #86efac; display: none; margin-bottom: 8px;
        }
        .btn-save-global {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white; border: none; border-radius: 14px; padding: 10px; font-size: 13px; font-weight: 900; cursor: pointer; width: 100%;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            border: 1px solid #93c5fd;
        }
        .section-title {
            width: 100%; max-width: 400px; font-size: 17px; font-weight: 900; color: #fb7185; margin-bottom: 14px; padding-left: 4px; text-transform: uppercase;
            text-shadow: 0 0 12px rgba(251, 113, 133, 0.6);
        }
        .games-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 400px; margin-bottom: 30px;
        }
        .game-card {
            background: linear-gradient(145deg, #231942, #3b255e); border-radius: 22px; padding: 16px 12px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: space-between; border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .game-card h3 { margin: 0 0 4px 0; font-size: 14px; color: #fff; font-weight: 900; }
        .game-desc { font-size: 11px; color: #e2e8f0; margin-bottom: 12px; font-weight: 600; }
        .btn-game {
            color: #ffffff; border: none; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 900; cursor: pointer; width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 2, 10, 0.96); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(12px);
        }
        .modal-content {
            background: linear-gradient(135deg, #181230, #2a2050); border-radius: 28px; padding: 20px; width: 95%; max-width: 400px; text-align: center;
            border: 2px solid #a855f7; box-shadow: 0 30px 70px rgba(168, 85, 247, 0.5); max-height: 92vh; overflow-y: auto;
        }
        .modal-title { font-size: 20px; font-weight: 900; color: #fde047; margin-bottom: 12px; text-shadow: 0 0 10px rgba(253, 224, 71, 0.5); }
        .animation-box {
            margin: 10px 0; min-height: 140px; display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .controls-group { margin-bottom: 12px; text-align: left; font-size: 13px; }
        .controls-group label { display: block; color: #cbd5e1; margin-bottom: 4px; font-weight: 800; }
        .controls-group select, .controls-group input {
            width: 100%; padding: 12px; border-radius: 14px; border: 2px solid #a855f7; background: #0f0c1b; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; font-weight: 700;
        }
        .btn-action {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; border-radius: 16px;
            padding: 14px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 6px;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6);
            border: 1px solid #86efac;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; border-radius: 16px;
            padding: 14px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 10px; display: none;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
            border: 1px solid #fcd34d;
        }
        .btn-close { background: transparent; border: none; color: #94a3b8; font-size: 14px; margin-top: 14px; cursor: pointer; text-decoration: underline; font-weight: 800; }
        
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 340px; margin: 0 auto;
        }
        .mine-cell {
            aspect-ratio: 1; background: linear-gradient(145deg, #3b82f6, #1d4ed8); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); border: 1.5px solid rgba(255,255,255,0.3);
            user-select: none;
        }
        .mine-cell:active { transform: scale(0.90); }
        .mine-cell.opened { background: #181230; border: 1.5px solid #6366f1; pointer-events: none; }
        .mine-cell.exploded { background: #ef4444 !important; border: 1.5px solid #f87171; pointer-events: none; }
        .mine-cell.disabled { pointer-events: none; opacity: 0.7; }
        .mines-footer {
            display: flex; justify-content: space-between; align-items: center; background: #0f0c1b; border-radius: 12px; padding: 8px 12px; margin-top: 10px; border: 2px solid #a855f7;
        }
        .ladder-steps {
            display: flex; flex-direction: column-reverse; gap: 5px; width: 100%; max-width: 260px; margin: 0 auto;
        }
        .ladder-step {
            background: #231942; border: 1.5px solid #6366f1; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between;
        }
        .ladder-step.active { background: #7c3aed; border-color: #fde047; box-shadow: 0 0 10px rgba(253,224,71,0.5); }
    </style>
</head>
<body>

    <div class="casino-header">
        <h1>⚡ VIP CASINO ⚡</h1>
        <div class="balance-container" id="balance">🪙 1000</div>
        <div class="bonus-info" id="timerText">Загрузка бонуса...</div>
        <button class="btn-bonus" onclick="claimBonus()">🎁 ЗАБРАТЬ БОНУС (+1000)</button>
        <button class="btn-save-global" onclick="manualSave()">💾 Сохранить прогресс</button>
    </div>

    <div class="section-title">🔥 Премиум Мини-Игры</div>

    <div class="games-grid">
        <div class="game-card" style="border-color: #fb7185;">
            <h3>✈ Самолётик</h3>
            <div class="game-desc">Крэш полет (без лимитов)</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #f43f5e, #e11d48);" onclick="openGame('crash')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #34d399;">
            <h3>💣 Мины</h3>
            <div class="game-desc">Динамический кэф мин</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="openGame('mines')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #facc15;">
            <h3>🪜 Лесенка</h3>
            <div class="game-desc">Выше шаг — выше риск</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #eab308, #ca8a04);" onclick="openGame('ladder')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #facc15;">
            <h3>🎰 Слоты 777</h3>
            <div class="game-desc">Настоящий авто-слот</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #ca8a04, #a16207);" onclick="openGame('slots')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #f472b6;">
            <h3>🎡 Колесо Фортуны</h3>
            <div class="game-desc">Случайный множитель</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #ec4899, #db2777);" onclick="openGame('wheel')">Играть</button>
        </div>
        <div class="game-card" style="border-color: #fb923c;">
            <h3>🥊 Ночной Нокаут</h3>
            <div class="game-desc">Больше выбор ударов</div>
            <button class="btn-game" style="background: linear-gradient(135deg, #f97316, #ea580c);" onclick="openGame('knockout')">Играть</button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Игра</div>
            <div class="animation-box" id="animBox">🎲</div>
            <div id="modalBody"></div>
            <button class="btn-action" id="actionBtn" onclick="executeGame()">Сделать ставку</button>
            <button class="btn-secondary" id="secondaryBtn" style="display:none;">Продолжить</button>
            <br>
            <button class="btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        if (tg && tg.expand) tg.expand();

        let balance = localStorage.getItem('casino_balance');
        if (balance === null) {
            balance = 1000;
        } else {
            balance = parseInt(balance);
        }

        let bonusEndTime = localStorage.getItem('casino_bonus_end');
        let nowSec = Math.floor(Date.now() / 1000);
        if (!bonusEndTime || parseInt(bonusEndTime) < nowSec) {
            bonusEndTime = nowSec + 60; // 1 минута таймер бонуса
            localStorage.setItem('casino_bonus_end', bonusEndTime);
        }

        let activeInterval = null;
        let currentGame = '';
        let gameActive = false;

        function saveState() {
            localStorage.setItem('casino_balance', balance);
        }

        function manualSave() {
            saveState();
            alert('💾 Прогресс и баланс успешно сохранены!');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        window.addEventListener('beforeunload', () => { saveState(); });

        setInterval(() => {
            let currentSec = Math.floor(Date.now() / 1000);
            let storedEnd = localStorage.getItem('casino_bonus_end');
            let diff = storedEnd ? parseInt(storedEnd) - currentSec : 0;
            let btn = document.querySelector('.btn-bonus');
            let timerTxt = document.getElementById('timerText');

            if (diff <= 0) {
                timerTxt.innerText = "БОНУС ДОСТУПЕН!";
                btn.style.display = "block";
            } else {
                let m = Math.floor(diff / 60);
                let s = diff % 60;
                timerTxt.innerText = `До бонуса осталось: ${m}:${s < 10 ? '0' : ''}${s}`;
                btn.style.display = "none";
            }
        }, 1000);

        function claimBonus() {
            balance += 1000;
            let newEnd = Math.floor(Date.now() / 1000) + 60;
            localStorage.setItem('casino_bonus_end', newEnd);
            saveState();
            updateDisplay();
            alert('🎁 Бонус 1000 монет зачислен!');
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = `🪙 ${balance}`;
        }

        updateDisplay();

        function resetButtons() {
            gameActive = false;
            let actionBtn = document.getElementById('actionBtn');
            let secBtn = document.getElementById('secondaryBtn');
            actionBtn.style.display = 'block';
            actionBtn.disabled = false;
            actionBtn.style.opacity = '1';
            actionBtn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
            secBtn.style.display = 'none';
            actionBtn.onclick = executeGame;
            secBtn.onclick = null;
        }

        function openGame(game) {
            currentGame = game;
            gameActive = false;
            if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }

            let title = document.getElementById('modalTitle');
            let body = document.getElementById('modalBody');
            let anim = document.getElementById('animBox');
            let actionBtn = document.getElementById('actionBtn');
            
            resetButtons();

            if (game === 'crash') {
                title.innerText = "✈ Самолётик";
                anim.innerHTML = `<canvas id="crashCanvas" width="340" height="140" style="background:#090714; border-radius:14px; border: 2px solid #6366f1;"></canvas>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Запустить полёт";
                initCrashCanvas(1.00, false);
            } 
            else if (game === 'mines') {
                title.innerText = "💣 Поле Мин";
                anim.innerHTML = `<div class="mines-grid" id="minesGrid"></div><div class="mines-footer"><span style="font-size:11px; color:#38bdf8;">💎 Ячейки</span><span style="font-size:11px; color:#ef4444;" id="mineRiskInfo">Динамический кэф</span></div>`;
                body.innerHTML = `<div class="controls-group" style="margin-top:6px;"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div><div class="controls-group"><label>Количество мин:</label><select id="mineCountSel" onchange="updateMineRisk()"><option value="1">1 мина (Легко)</option><option value="3" selected>3 мины (Средне)</option><option value="5">5 мин (Рискованно)</option><option value="10">10 мин (Хардкор)</option></select></div>`;
                actionBtn.innerText = "Начать игру";
                renderMinesPreview(3);
            }
            else if (game === 'ladder') {
                title.innerText = "🪜 Лесенка Удачи";
                anim.innerHTML = `<div class="ladder-steps" id="ladderBox">
                    <div class="ladder-step" data-step="5"><span>Шаг 5 (x5.0)</span><span>Шанс: 25%</span></div>
                    <div class="ladder-step" data-step="4"><span>Шаг 4 (x3.0)</span><span>Шанс: 40%</span></div>
                    <div class="ladder-step" data-step="3"><span>Шаг 3 (x2.0)</span><span>Шанс: 55%</span></div>
                    <div class="ladder-step" data-step="2"><span>Шаг 2 (x1.5)</span><span>Шанс: 70%</span></div>
                    <div class="ladder-step active" data-step="1"><span>Шаг 1 (x1.2)</span><span>Шанс: 85%</span></div>
                </div>`;
                body.innerHTML = `<div class="controls-group" style="margin-top:8px;"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Сделать шаг вверх";
            }
            else if (game === 'slots') {
                title.innerText = "🎰 Слоты 777";
                anim.innerHTML = `<div style="font-size:30px; background:#0f0c1b; border-radius:14px; padding:16px; border:2px solid #eab308; letter-spacing:6px;" id="slotBox">🍒 🍋 🔔</div>`;
                body.innerHTML = `<div class="controls-group" style="margin-top:8px;"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Крутить слоты";
            }
            else if (game === 'wheel') {
                title.innerText = "🎡 Колесо Фортуны";
                anim.innerHTML = `<div id="wheelBox" style="font-size:28px; font-weight:bold; color:#fde047; padding:20px;">🎡 Случайный множитель</div>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div>`;
                actionBtn.innerText = "Крутить колесо";
            }
            else if (game === 'knockout') {
                title.innerText = "🥊 Ночной Нокаут";
                anim.innerHTML = `<div style="font-size:36px;" id="knockoutBox">🥊 vs 🤖</div>`;
                body.innerHTML = `<div class="controls-group"><label>Ставка:</label><input type="number" id="bet" value="50" min="1"></div><div class="controls-group"><label>Выбор удара:</label><select id="knockoutRisk"><option value="jab">Быстрый джеб (x1.2 / 70%)</option><option value="cross" selected>Прямой удар (x1.5 / 50%)</option><option value="hook">Нокаут хук (x2.5 / 30%)</option><option value="uppercut">Апперкот (x4.0 / 15%)</option><option value="ultimate">Тайный удар (x7.5 / 5%)</option></select></div>`;
                actionBtn.innerText = "Нанести удар";
            }

            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeModal() {
            if (activeInterval) { clearInterval(activeInterval); activeInterval = null; }
            gameActive = false;
            document.getElementById('gameModal').style.display = 'none';
        }

        function updateMineRisk() {
            renderMinesPreview(parseInt(document.getElementById('mineCountSel').value));
        }

        function renderMinesPreview(mCount) {
            let grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell disabled';
                cell.innerText = '?';
                grid.appendChild(cell);
            }
        }

        function initCrashCanvas(mult, isCrashed, textStatus="") {
            let canvas = document.getElementById('crashCanvas');
            if (!canvas) return;
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let progress = Math.min((mult - 1.0) / 9.0, 1);
            let endX = 30 + progress * 260;
            let endY = 110 - progress * 70;
            ctx.strokeStyle = isCrashed ? '#ef4444' : '#38bdf8'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(20, 110); ctx.quadraticCurveTo(80, 110, endX, endY); ctx.stroke();
            ctx.font = '18px Arial'; ctx.fillText(isCrashed ? '💥' : '✈', endX - 10, endY + 6);
            ctx.fillStyle = isCrashed ? '#ef4444' : '#fde047'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
            ctx.fillText(mult.toFixed(2) + 'x', canvas.width / 2, 30);
            if (textStatus) { ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px Arial'; ctx.fillText(textStatus, canvas.width / 2, 128); }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        function executeGame() {
            let bet = parseInt(document.getElementById('bet').value);
            if (isNaN(bet) || bet <= 0) { alert('⚠️ Введите корректную ставку!'); return; }
            if (balance < bet) { alert('❌ Недостаточно средств!'); return; }

            let actionBtn = document.getElementById('actionBtn');
            let secBtn = document.getElementById('secondaryBtn');

            balance -= bet; saveState(); updateDisplay();
            gameActive = true; 

            // 1. САМОЛЕТИК (Краш)
            if (currentGame === 'crash') {
                actionBtn.disabled = true;
                let mult = 1.0;
                let targetCrash = parseFloat((1.01 + Math.random() * Math.random() * 7).toFixed(2));

                actionBtn.innerText = "💰 ЗАБРАТЬ ДЕНЬГИ";
                actionBtn.disabled = false;
                actionBtn.style.background = "linear-gradient(135deg, #f59e0b, #d97706)";

                activeInterval = setInterval(() => {
                    if (!gameActive) return;
                    mult = parseFloat((mult + 0.05).toFixed(2));
                    initCrashCanvas(mult, false);

                    if (mult >= targetCrash) {
                        clearInterval(activeInterval);
                        gameActive = false;
                        initCrashCanvas(targetCrash, true, `КРУШЕНИЕ на ${targetCrash}x! Ставка сгорела.`);
                        actionBtn.disabled = true;
                        actionBtn.style.opacity = '0.4';
                        setTimeout(() => resetButtons(), 1500);
                    }
                }, 90);

                actionBtn.onclick = function() {
                    if (!gameActive) return;
                    clearInterval(activeInterval);
                    gameActive = false;
                    let winSum = Math.floor(bet * mult);
                    balance += winSum; saveState(); updateDisplay();
                    initCrashCanvas(mult, false, `ВЫИГРАНО: +${winSum} 🪙 (x${mult})`);
                    actionBtn.disabled = true;
                    actionBtn.style.opacity = '0.4';
                    setTimeout(() => resetButtons(), 1500);
                };
                return;
            }

            // 2. МИНЫ (Динамический кэф)
            if (currentGame === 'mines') {
                let mCount = parseInt(document.getElementById('mineCountSel').value);
                let mines = [];
                while(mines.length < mCount) {
                    let r = Math.floor(Math.random() * 25);
                    if(!mines.includes(r)) mines.push(r);
                }
                let openedCount = 0;
                let grid = document.getElementById('minesGrid');
                grid.innerHTML = '';
                
                let baseMult = 1.0 + (mCount * 0.15);

                for(let i = 0; i < 25; i++) {
                    let cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    cell.innerText = '?';
                    let isMine = mines.includes(i);
                    
                    cell.onclick = function() {
                        if(!gameActive || cell.classList.contains('opened') || cell.classList.contains('exploded')) return;
                        
                        if(isMine) {
                            gameActive = false;
                            cell.classList.add('exploded');
                            cell.innerText = '💣';
                            let allCells = grid.children;
                            for(let j = 0; j < 25; j++) {
                                allCells[j].classList.add('disabled');
                                if(mines.includes(j)) {
                                    allCells[j].classList.add('exploded');
                                    allCells[j].innerText = '💣';
                                }
                            }
                            actionBtn.disabled = true;
                            actionBtn.style.opacity = '0.4';
                            alert('💥 Вы подорвались на мине! Ставка сгорела.');
                            setTimeout(() => resetButtons(), 1500);
                        } else {
                            if (!gameActive) return;
                            cell.classList.add('opened');
                            cell.innerText = '💎';
                            openedCount++;
                            let curMult = parseFloat(Math.pow(baseMult, openedCount).toFixed(2));
                            actionBtn.innerText = `ЗАБРАТЬ (${Math.floor(bet * curMult)} 🪙 [x${curMult}])`;
                            
                            actionBtn.onclick = function() {
                                if(!gameActive) return;
                                gameActive = false;
                                let reward = Math.floor(bet * curMult);
                                balance += reward; saveState(); updateDisplay();
                                let allCells = grid.children;
                                for(let j = 0; j < 25; j++) allCells[j].classList.add('disabled');
                                alert(`🎉 Вы забрали ${reward} монет (x${curMult})!`);
                                resetButtons();
                            };
                        }
                    };
                    grid.appendChild(cell);
                }
                actionBtn.innerText = "ОТКРЫВАЙТЕ ЯЧЕЙКИ БЕЗ МИН";
                return;
            }

            // 3. ЛЕСЕНКА
            if (currentGame === 'ladder') {
                actionBtn.disabled = true;
                let currentStep = 1;
                let multipliers = { 1: 1.2, 2: 1.5, 3: 2.0, 4: 3.0, 5: 5.0 };
                let chances = { 1: 0.85, 2: 0.70, 3: 0.55, 4: 0.40, 5: 0.25 };

                actionBtn.innerText = "ШАГНУТЬ НА ШАГ 2 (x1.5)";
                secBtn.style.display = 'block';
                secBtn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
                secBtn.innerText = "ЗАБРАТЬ ВЫИГРЫШ";

                actionBtn.onclick = function() {
                    if(!gameActive) return;
                    let chance = chances[currentStep];
                    if (Math.random() > chance) {
                        gameActive = false;
                        alert(`💥 Промах на шаге ${currentStep}! Вы сорвались с лестницы.`);
                        resetButtons();
                        return;
                    }

                    currentStep++;
                    if (currentStep > 5) {
                        gameActive = false;
                        let reward = Math.floor(bet * 5.0);
                        balance += reward; saveState(); updateDisplay();
                        alert(`🏆 ПОБЕДА! Вы прошли всю лестницу и забрали ${reward} монет (x5.0)!`);
                        resetButtons();
                        return;
                    }

                    let nextMult = multipliers[currentStep];
                    actionBtn.innerText = `ШАГНУТЬ НА ШАГ ${currentStep} (x${nextMult})`;
                    alert(`✅ Шаг ${currentStep - 1} пройден! Идем дальше.`);
                };

                secBtn.onclick = function() {
                    if(!gameActive) return;
                    gameActive = false;
                    let lastMult = multipliers[currentStep - 1];
                    let reward = Math.floor(bet * lastMult);
                    balance += reward; saveState(); updateDisplay();
                    alert(`🎉 Вы забрали ${reward} монет на шаге ${currentStep - 1}!`);
                    resetButtons();
                };
                return;
            }

            // 4. СЛОТЫ 777
            if (currentGame === 'slots') {
                actionBtn.disabled = true;
                let slotBox = document.getElementById('slotBox');
                let symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣', 'BAR'];
                let weights = [40, 30, 15, 10, 4, 1];
                let steps = 0;
                
                activeInterval = setInterval(() => {
                    if(!gameActive) return;
                    steps++;
                    let getRandomSym = () => {
                        let total = weights.reduce((a,b)=>a+b,0);
                        let r = Math.random() * total;
                        for(let i=0; i<symbols.length; i++) {
                            if(r < weights[i]) return symbols[i];
                            r -= weights[i];
                        }
                        return symbols[0];
                    };
                    slotBox.innerHTML = `${getRandomSym()} ${getRandomSym()} ${getRandomSym()}`;
                    
                    if(steps > 12) {
                        clearInterval(activeInterval);
                        gameActive = false;
                        
                        let s1 = getRandomSym();
                        let s2 = getRandomSym();
                        let s3 = getRandomSym();
                        slotBox.innerHTML = `${s1} ${s2} ${s3}`;
                        
                        let mult = 0;
                        if(s1 === s2 && s2 === s3) {
                            switch(s1) {
                                case '🍒': mult = 5; break;
                                case '🍋': mult = 10; break;
                                case '🔔': mult = 20; break;
                                case '💎': mult = 50; break;
                                case '7️⃣': mult = 100; break;
                                case 'BAR': mult = 500; break;
                            }
                        }
                        
                        let reward = Math.floor(bet * mult);
                        if(reward > 0) { balance += reward; saveState(); updateDisplay(); }
                        slotBox.innerHTML += `<br><span style="font-size:12px; color:#fff;">Выигрыш: ${reward} 🪙 (x${mult})</span>`;
                        resetButtons();
                    }
                }, 80);
                return;
            }

            // 5. КОЛЕСО ФОРТУНЫ
            if (currentGame === 'wheel') {
                actionBtn.disabled = true;
                let wheelBox = document.getElementById('wheelBox');
                let steps = 0;
                activeInterval = setInterval(() => {
                    if(!gameActive) return;
                    steps++;
                    let randM = parseFloat((Math.random() * 4.9 + 0.1).toFixed(2));
                    wheelBox.innerHTML = `🎡 [ x${randM} ]`;
                    if(steps > 10) {
                        clearInterval(activeInterval);
                        gameActive = false;
                        let finalM = parseFloat((Math.random() * 4.9 + 0.1).toFixed(2));
                        let reward = Math.floor(bet * finalM);
                        balance += reward; saveState(); updateDisplay();
                        wheelBox.innerHTML = `🎡 [ x${finalM} ]<br><span style="font-size:12px; color:#fff;">Выигрыш: ${reward} 🪙</span>`;
                        resetButtons();
                    }
                }, 80);
                return;
            }

            // 6. НОЧНОЙ НОКАУТ
            if (currentGame === 'knockout') {
                actionBtn.disabled = true;
                let moveKey = document.getElementById('knockoutRisk').value;
                let movesData = {
                    jab: { name: 'Быстрый джеб', mult: 1.2, chance: 0.7 },
                    cross: { name: 'Прямой удар', mult: 1.5, chance: 0.5 },
                    hook: { name: 'Нокаут хук', mult: 2.5, chance: 0.3 },
                    uppercut: { name: 'Апперкот', mult: 4.0, chance: 0.15 },
                    ultimate: { name: 'Тайный удар', mult: 7.5, chance: 0.05 }
                };
                let move = movesData[moveKey];

                setTimeout(() => {
                    if(!gameActive) return;
                    let success = Math.random() <= move.chance;
                    let reward = success ? Math.floor(bet * move.mult) : 0;
                    
                    if(success) { balance += reward; saveState(); updateDisplay(); }
                    document.getElementById('knockoutBox').innerText = success ? `🏆 НОКАУТ! +${reward} 🪙 (x${move.mult})` : `❌ МИМО! Соперник увернулся.`;
                    gameActive = false;
                    resetButtons();
                }, 1000);
                return;
            }
        }
    </script>
</body>
</html>
